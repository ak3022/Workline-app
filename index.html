<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Amber">
<meta name="theme-color" content="#005CAB">
<link rel="apple-touch-icon" id="aiLink">
<link rel="icon" id="favLink">
<link rel="manifest" id="mfLink">
<title>Amber Exports · Process Tracker</title>
<style>
  :root{
    --blue:#005CAB; --blue-press:#00468A; --blue-tint:#E7F0F8;
    --red:#ED1C24;  --red-tint:#FDEBEC;
    --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FA;
    --ink:#1D1D1F; --ink2:#6E6E73; --muted:#8E8E93;
    --line:#E5E5EA; --hairline:rgba(60,60,67,.12);
    --green:#2FA84F; --orange:#F08C00;
    --p-nitin:#005CAB; --p-manish:#0E9594; --p-rahul:#E08D00;
    --p-rishabh:#6A4C93; --p-radhika:#9B2C6F; --p-chandran:#C15B3F;
    --r:16px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;touch-action:pan-x pan-y}
  body{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden;
    letter-spacing:-0.01em}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;letter-spacing:inherit}
  input,select,textarea{font-family:inherit;letter-spacing:inherit}
  .hidden{display:none!important}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);
    padding:12px 18px;border-bottom:.5px solid var(--hairline);display:flex;align-items:center;gap:12px}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand b{font-size:16px;font-weight:600;letter-spacing:-0.02em}
  .brand span{font-size:11.5px;color:var(--muted);margin-top:1px}
  .who{margin-left:auto;display:flex;align-items:center;gap:9px}
  .avatar{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex-shrink:0}
  .hdr-av{width:32px;height:32px;font-size:12px;position:relative}
  .hdr-av::after{content:'⚙';position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;background:var(--card);border:1px solid var(--hairline);border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
  .who button{background:var(--card2);color:var(--blue);font-size:13px;font-weight:500;padding:7px 13px;border-radius:20px}

  main{padding:16px 16px 96px}
  h2.vt{font-size:26px;font-weight:700;letter-spacing:-0.03em;margin:8px 2px 2px}
  .sub{color:var(--muted);font-size:14px;margin:0 2px 18px}

  /* ---------- login ---------- */
  #login{padding:0;min-height:100vh;min-height:100dvh;background:#fff;display:flex;flex-direction:column;position:relative}
  .login-hero{padding:56px 26px 12px;text-align:center}
  .login-hero img{width:260px;height:181px;object-fit:contain;margin:0 auto 26px;display:block}
  .login-hero h1{margin:0 0 5px;font-size:23px;font-weight:700;letter-spacing:-0.03em}
  .login-hero p{margin:0;color:var(--ink2);font-size:14.5px}
  .boss-tag{font-size:9.5px;background:var(--red-tint);color:var(--red);padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.4px;margin-left:7px;vertical-align:middle}
  .login-form{padding:6px 26px 30px;max-width:400px;margin:0 auto;width:100%}
  .lf-label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:16px 2px 8px}
  .lf-input{width:100%;background:var(--card);border:.5px solid var(--hairline);border-radius:12px;padding:15px;font-size:17px;color:var(--ink)}
  .lf-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-tint)}
  .lf-btn{width:100%;background:var(--blue);color:#fff;border-radius:13px;padding:15px;font-size:16px;font-weight:600;margin-top:18px}
  .lf-btn:active{background:var(--blue-press)}
  .lf-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.6}
  .lf-err{color:var(--red);font-size:13px;text-align:center;margin-top:12px;min-height:18px}
  .lf-sub{font-size:13.5px;color:var(--ink2);margin:0 2px 16px}
  .otp-boxes{display:flex;gap:9px;justify-content:space-between}
  .otp-boxes input{width:100%;aspect-ratio:1/1;min-width:0;text-align:center;font-size:22px;font-weight:600;background:var(--card);border:.5px solid var(--hairline);border-radius:12px;color:var(--ink)}
  .otp-boxes input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-tint)}
  .lf-links{display:flex;justify-content:space-between;margin-top:18px;font-size:14px;color:var(--blue)}
  .lf-links span{cursor:pointer}
  .remember{display:flex;align-items:center;gap:11px;font-size:14.5px;color:var(--ink2);margin:18px 2px 2px;cursor:pointer}
  .remember input{width:21px;height:21px;accent-color:var(--blue);flex-shrink:0}
  .lf-toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;z-index:99;opacity:0;transition:.25s}
  .lf-toast.show{opacity:1}

  /* ---------- cards / tasks ---------- */
  .card{background:var(--card);border:.5px solid var(--hairline);border-radius:var(--r);padding:16px;margin-bottom:14px}
  .card-h{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.2px;margin:0 0 2px}

  .task{background:var(--card);border:.5px solid var(--hairline);border-radius:14px;
    padding:13px 14px;margin-bottom:10px;transition:.12s;position:relative;overflow:hidden}
  .task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--st,transparent)}
  .task:active{background:var(--card2)}
  .task .top{display:flex;align-items:flex-start;gap:11px}
  .tname{font-weight:600;font-size:15.5px;flex:1;line-height:1.3;letter-spacing:-0.01em}
  .tmeta{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .chip{font-size:11px;padding:2.5px 8px;border-radius:7px;font-weight:600;white-space:nowrap}
  .chip.client{background:var(--blue);color:#fff}
  .chip.order{background:var(--blue-tint);color:var(--blue)}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.1px;white-space:nowrap}
  .b-overdue{background:var(--red-tint);color:var(--red)}
  .b-soon{background:#FFF3E0;color:var(--orange)}
  .b-done{background:#E7F6EC;color:var(--green)}
  .b-prog{background:var(--blue-tint);color:var(--blue)}
  .b-pending{background:#EFEFF2;color:var(--ink2)}
  .owner-pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2)}
  .owner-pill .avatar{width:22px;height:22px;font-size:10px}
  .due{font-size:12.5px}

  .grp-h{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:20px 4px 10px;display:flex;align-items:center;gap:8px}
  .grp-h .cnt{background:#E3E3E8;color:var(--ink2);border-radius:20px;padding:1px 8px;font-size:11.5px}

  /* ---------- search / toolbar ---------- */
  .search{width:100%;background:#E9E9EE;border:none;border-radius:11px;padding:11px 14px;color:var(--ink);font-size:15px;margin-bottom:14px}
  .search::placeholder{color:var(--muted)}

  /* ---------- orders ---------- */
  .order-card{background:var(--card);border:.5px solid var(--hairline);border-radius:var(--r);padding:15px;margin-bottom:12px;transition:.12s}
  .order-card:active{background:var(--card2)}
  .oc-top{display:flex;align-items:center;gap:9px}
  .oc-code{font-weight:700;font-size:17px;letter-spacing:-0.02em}
  .oc-style{font-size:13px;color:var(--muted);margin-top:2px}
  .bar{height:7px;background:#E9E9EE;border-radius:20px;overflow:hidden;margin-top:13px}
  .bar>i{display:block;height:100%;background:var(--green);border-radius:20px;transition:width .3s}
  .oc-stats{display:flex;gap:16px;margin-top:11px;font-size:12.5px;color:var(--ink2)}
  .oc-stats b{color:var(--ink);font-weight:600}

  /* ---------- dashboard ---------- */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
  .kpi{background:var(--card);border:.5px solid var(--hairline);border-radius:var(--r);padding:15px}
  .kpi .v{font-size:30px;font-weight:700;line-height:1;letter-spacing:-0.03em}
  .kpi .l{font-size:12.5px;color:var(--muted);margin-top:7px}
  .kpi.red .v{color:var(--red)} .kpi.orange .v{color:var(--orange)}
  .person-row{display:flex;align-items:center;gap:11px;margin:13px 0}
  .person-row .avatar{width:30px;height:30px;font-size:12px}
  .pr-name{font-size:14px;width:74px;flex-shrink:0;font-weight:500}
  .pr-bar{flex:1;height:20px;background:#EDEDF1;border-radius:7px;overflow:hidden;display:flex}
  .pr-bar>span{height:100%;display:flex;align-items:center;padding-left:7px;font-size:10.5px;font-weight:700;color:#fff;min-width:0}
  .pr-total{font-size:14px;font-weight:700;width:26px;text-align:right}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink2)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

  /* whatsapp alerts */
  .wa-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .wa-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#128C7E;background:#E3F5EF;padding:3px 9px;border-radius:20px}
  .stepper{display:inline-flex;align-items:center;gap:0;background:#EDEDF1;border-radius:9px;overflow:hidden}
  .stepper button{width:30px;height:28px;font-size:17px;color:var(--blue);background:transparent}
  .stepper span{min-width:30px;text-align:center;font-size:14px;font-weight:600}
  .wa-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:.5px solid var(--hairline)}
  .wa-row:first-of-type{border-top:none}
  .wa-row .avatar{width:30px;height:30px;font-size:12px}
  .wa-name{font-size:14px;font-weight:600}
  .wa-sub{font-size:12px;color:var(--muted)}
  .wa-btn{margin-left:auto;background:#25D366;color:#063;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:20px}
  .wa-none{font-size:13px;color:var(--muted);padding:6px 0}

  /* team management */
  .add-person{width:100%;background:var(--blue);color:#fff;border-radius:13px;padding:14px;font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px}
  .team-card{background:var(--card);border:.5px solid var(--hairline);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:13px;margin-bottom:10px}
  .team-card .avatar{width:44px;height:44px;font-size:16px}
  .tc-name{font-weight:600;font-size:16px}
  .tc-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .tc-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
  .reorder{display:flex;flex-direction:column;gap:4px}
  .reorder button{width:30px;height:24px;border-radius:7px;background:var(--card2);border:.5px solid var(--hairline);color:var(--blue);font-size:11px;display:grid;place-items:center}
  .reorder button:disabled{opacity:.3}
  .tc-edit{background:var(--blue-tint);color:var(--blue);font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:20px}
  .toggle{display:flex;align-items:center;gap:12px;background:var(--card);border:.5px solid var(--hairline);border-radius:12px;padding:14px;margin-bottom:15px}
  .toggle input{width:22px;height:22px;accent-color:var(--blue);flex-shrink:0}
  .toggle b{font-size:14.5px}.toggle p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .warn-box{background:var(--red-tint);border-radius:12px;padding:13px;font-size:13.5px;color:#8a1a1f;margin-bottom:14px;line-height:1.45}

  /* progress / timeline */
  .seg{display:flex;background:#E9E9EE;border-radius:11px;padding:3px;gap:3px}
  .seg button{flex:1;background:transparent;color:var(--ink2);padding:9px;border-radius:9px;font-size:14px;font-weight:600}
  .seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .tl-legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink2)}
  .tl-legend .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .tl-legend .dot.hollow{background:#fff;border:1.5px solid #B4B4BC}
  .tl-legend .dot.hollow.red{border-color:var(--red)}
  .trend-note{font-size:13.5px;font-weight:600;padding:10px 13px;border-radius:11px;margin-bottom:12px;line-height:1.4}
  .trend-note.good{background:#E7F6EC;color:#1c7a3a}
  .trend-note.bad{background:var(--red-tint);color:#b3271e}

  /* header theme toggle + tappable dashboard order */
  .who .icon-btn{background:var(--card2);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;color:var(--ink2);padding:0}
  .who .icon-btn svg{width:18px;height:18px}
  .dash-order{background:var(--card2);border-radius:12px;padding:12px 13px;margin:10px 0 0}

  /* tap feedback (mobile responsiveness) */
  button,.tap,.order-card,.task,.person-row-l{touch-action:manipulation}
  .tap{transition:background .09s ease, transform .09s ease}
  .tap:active{background:var(--card2);transform:scale(.985)}
  .btn:active,.lf-btn:active{filter:brightness(.93);transform:scale(.985)}
  .add-person:active,.wa-btn:active,.tc-edit:active,.fab:active{filter:brightness(.9);transform:scale(.96)}
  nav button:active{opacity:.55}
  .icon-btn:active{background:var(--line)}
  #themeBtnLogin{background:var(--card2);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;color:var(--ink2);padding:0}
  #themeBtnLogin svg{width:18px;height:18px}
  body.dark #themeBtnLogin{background:#2C2C2E}
  .seg-status button:active,.stepper button:active{filter:brightness(.94)}

  /* ---------- dark mode ---------- */
  body.dark{
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E;
    --ink:#F5F5F7; --ink2:#AEAEB2; --muted:#8E8E93;
    --line:#38383A; --hairline:rgba(255,255,255,.14);
    --blue:#3B96F0; --blue-press:#2f83d6; --blue-tint:rgba(59,150,240,.22);
    --red:#FF5A52; --red-tint:rgba(255,90,82,.20);
    --green:#30D158; --orange:#FF9F0A;
  }
  body.dark header{background:rgba(20,20,22,.8)}
  body.dark nav{background:rgba(20,20,22,.86)}
  body.dark #login{background:var(--bg)}
  body.dark .search,body.dark .seg,body.dark .stepper{background:#2C2C2E}
  body.dark .seg button.on{background:#48484A;color:#fff}
  body.dark .bar,body.dark .pr-bar{background:#2C2C2E}
  body.dark .grab{background:#48484A}
  body.dark .b-overdue{background:rgba(255,90,82,.24);color:#ff9b95}
  body.dark .b-soon{background:rgba(255,159,10,.24);color:#ffc470}
  body.dark .b-done{background:rgba(48,209,88,.22);color:#5be08a}
  body.dark .b-prog{background:rgba(59,150,240,.24);color:#8fc2f7}
  body.dark .b-pending{background:#3A3A3C;color:#c7c7cc}
  body.dark .wa-badge{background:rgba(37,211,102,.18);color:#54d98c}
  body.dark .warn-box{background:rgba(255,90,82,.16);color:#ff9b95}

  /* ---------- nav ---------- */
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;
    background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--hairline);
    display:flex;padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:30}
  nav button{flex:1;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;padding:3px}
  nav button.on{color:var(--blue)}
  nav button svg{width:24px;height:24px}

  .fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));right:calc(50% - 250px + 18px);
    width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;font-size:30px;font-weight:300;
    display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,92,171,.4);z-index:29}
  @media(max-width:520px){.fab{right:18px}}

  /* ---------- modal / sheet ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:94vh;max-height:94dvh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px)}to{transform:translateY(0)}}
  .grab{width:38px;height:5px;background:#D1D1D6;border-radius:3px;margin:8px auto 14px}
  .sheet h3{margin:0 0 3px;font-size:21px;font-weight:700;letter-spacing:-0.02em}
  .sheet .mh-sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:7px;font-weight:600}
  .field input,.field select{width:100%;background:var(--card);border:.5px solid var(--hairline);border-radius:11px;padding:13px;color:var(--ink);font-size:16px}
  .two{display:flex;gap:10px}.two>div{flex:1}
  .row-btns{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;padding:14px;border-radius:13px;font-size:16px;font-weight:600;background:var(--card);color:var(--blue);border:.5px solid var(--hairline)}
  .btn.primary{background:var(--blue);color:#fff;border:none}
  .btn.green{background:var(--green);color:#fff;border:none}
  .btn.danger{background:var(--card);color:var(--red)}
  .seg-status{display:flex;gap:8px;margin-bottom:4px}
  .seg-status button{flex:1;padding:11px;border-radius:11px;font-size:13.5px;font-weight:600;background:var(--card);border:.5px solid var(--hairline);color:var(--ink2)}
  .seg-status button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .cascade{display:flex;align-items:center;gap:11px;background:var(--card);border:.5px solid var(--hairline);border-radius:12px;padding:13px;margin-bottom:14px}
  .cascade input{width:22px;height:22px;accent-color:var(--blue)}
  .cascade div{flex:1}.cascade b{font-size:14px}.cascade p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .steps-preview{background:var(--card);border:.5px solid var(--hairline);border-radius:12px;padding:6px 14px;max-height:190px;overflow:auto;font-size:13.5px}
  .steps-preview div{padding:7px 0;display:flex;justify-content:space-between;gap:8px;border-top:.5px solid var(--hairline)}
  .steps-preview div:first-child{border-top:none}
  .steps-preview .so{color:var(--muted);font-size:12.5px}
  textarea.note{width:100%;background:var(--card);border:.5px solid var(--hairline);border-radius:11px;padding:12px;font-size:15px;resize:vertical;min-height:60px;color:var(--ink)}

  /* whatsapp preview bubble */
  .wa-phone{background:#E5DDD5;border-radius:14px;padding:16px;margin-bottom:14px}
  .wa-bubble{background:#DCF8C6;border-radius:12px;border-top-right-radius:3px;padding:11px 13px;font-size:14px;line-height:1.45;max-width:88%;margin-left:auto;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-wrap}
  .wa-time{font-size:10px;color:#667;text-align:right;margin-top:3px}

  .empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:14px}
  .empty .big{font-size:40px;margin-bottom:10px}
  .note-sim{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}
</style>
<style>
/* ===== v6 additions: categories, flowchart, comments, chart ===== */
:root{
  --ss:#0E9594;
  --fs:var(--blue);
  --idle:#F08C00;
}
.cat-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cat-pick button{flex:1 1 28%;min-width:90px;background:var(--card);border:1px solid var(--hairline);border-radius:13px;padding:12px 8px;font-size:12.5px;font-weight:600;color:var(--ink2);text-align:center;line-height:1.3}
.cat-pick button.on{background:var(--blue-tint);border-color:var(--blue);color:var(--blue)}
.cat-chip{font-size:10.5px;font-weight:700;padding:2.5px 8px;border-radius:7px;background:var(--card2);color:var(--ink2);letter-spacing:.2px;vertical-align:middle}

.tplcard{background:var(--card);border:.5px solid var(--hairline);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tplcard b{font-size:15px}
.tplcard p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}

.fc-wrap{overflow:auto;background:var(--card2);border-radius:14px;padding:10px;max-height:60vh;max-height:60dvh}
.fc-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:10px}
.fc-legend .ln{display:inline-flex;align-items:center;gap:6px}
.fc-legend .sw{width:18px;height:0;border-top:2.5px solid}
.fc-legend .sw.dash{border-top-style:dashed}

.cmt{background:var(--card2);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.cmt-head{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.cmt-body{font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.cmt-edit{color:var(--blue);font-size:12px;font-weight:600;margin-top:6px;cursor:pointer}

.dep-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:.5px solid var(--hairline)}
.dep-row:first-of-type{border-top:none}
.dep-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);flex-shrink:0}
.dep-name{flex:1;font-size:14.5px}
.dep-type{display:flex;background:#E9E9EE;border-radius:9px;padding:2px;gap:2px;flex-shrink:0}
.dep-type button{padding:6px 9px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--ink2);background:transparent}
.dep-type button.on{background:var(--blue);color:#fff}
.dep-type button.on.ss{background:var(--ss);color:#fff}
@keyframes tutBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

.b-idle{background:#FFF3E0;color:var(--idle)}
.b-locked{background:#EFEFF2;color:var(--ink2)}
.waiting{font-size:12px;color:var(--muted);margin-top:4px}

.chart-tip{background:var(--card2);border-radius:12px;padding:11px 13px;font-size:13px;margin-top:10px;min-height:20px;line-height:1.5}

.cmt-chip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--card2);color:var(--ink2);letter-spacing:.1px;white-space:nowrap}
body.dark .cmt-chip{background:#3A3A3C}

.task{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cmt-timeline{margin-top:12px;padding-top:2px}
.cmt-tl-item{position:relative;padding-left:20px;padding-bottom:14px}
.cmt-tl-item:last-child{padding-bottom:0}
.cmt-tl-item:not(:last-child)::before{content:'';position:absolute;left:4px;top:13px;bottom:-1px;width:1.5px;background:var(--hairline)}
.cmt-tl-dot{position:absolute;left:0;top:4px;width:9px;height:9px;border-radius:50%;background:var(--blue);border:2px solid var(--card2)}
.cmt-tl-head{font-size:11px;color:var(--muted);margin-bottom:3px}
.cmt-tl-text{font-size:13.5px;line-height:1.4;color:var(--ink);background:var(--card2);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
body.dark .cmt-tl-text{background:#2C2C2E}
body.dark .cmt{background:#2C2C2E}
body.dark .b-idle{background:rgba(240,140,0,.22);color:#ffc470}
body.dark .b-locked{background:#3A3A3C;color:#c7c7cc}
body.dark .dep-type{background:#2C2C2E}

/* ===== short-viewport login: landscape phones, or any short height ===== */
@media (max-height:520px){
  .login-hero{padding:18px 26px 6px}
  .login-hero img{width:100px;height:70px;margin:0 auto 10px}
  .login-hero h1{font-size:18px;margin-bottom:3px}
  .login-hero p{font-size:12.5px}
  .login-form{padding:2px 26px 16px}
  .lf-label{margin:10px 2px 6px}
  .lf-input{padding:11px}
  .lf-btn{padding:11px;margin-top:12px}
  .otp-boxes input{font-size:18px}
  .lf-hint{margin-top:10px}
  .remember{margin:10px 2px 2px}
}

/* ===== people (fully customizable, persisted in DB.people) ===== */
const COLOR_POOL=['#005CAB','#0E9594','#E08D00','#6A4C93','#9B2C6F','#C15B3F',
  '#3A86FF','#2A9D8F','#E76F51','#8338EC','#457B9D','#B5179E','#588157','#D62828','#7209B7','#F08C00'];
const SEED_PEOPLE=[
  {name:'Nitin',    phone:'', color:'#005CAB'},
  {name:'Manish',   phone:'', color:'#0E9594'},
  {name:'Rahul',    phone:'', color:'#E08D00'},
  {name:'Rishabh',  phone:'', color:'#6A4C93', boss:true},
  {name:'Radhika',  phone:'', color:'#9B2C6F', boss:true},
  {name:'Chandran', phone:'', color:'#C15B3F'},
  {name:'Sanjay',   phone:'', color:'#3A86FF', boss:true},
];
let PEOPLE=[];
const personColor = n => (PEOPLE.find(p=>p.name===n)||{}).color || '#8E8E93';
const initials = n => (n||'?').trim().slice(0,2).toUpperCase() || '?';
const nextColor = () => {const used=new Set(PEOPLE.map(p=>p.color));return COLOR_POOL.find(c=>!used.has(c))||COLOR_POOL[PEOPLE.length%COLOR_POOL.length];};
const openCount = name => DB.tasks.filter(t=>t.owner===name&&t.status!=='completed').length;

/* ===== date helpers ===== */
const DAY=86400000;
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>new Date(d.getTime()+n*DAY);
const fmtISO=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());};
const fmtNice=iso=>{if(!iso)return'—';const d=parseD(iso);const p=n=>String(n).padStart(2,'0');return`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;};
const daysFromToday=iso=>Math.round((parseD(iso)-today())/DAY);
const nowStamp=()=>new Date().toISOString();
const fmtStamp=iso=>{const d=new Date(iso);const p=n=>String(n).padStart(2,'0');return`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});};

/* ===== storage ===== */
const KEY='amber_tracker_v7';
let DB={people:[],templates:null,orders:[],tasks:[],edges:[],seq:1,threshold:5,qualities:[],notifyDays:[1,2,3,4,5]};
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function load(){let r=null;try{r=localStorage.getItem(KEY);}catch(e){}
  if(r){try{DB=JSON.parse(r);}catch(e){}}
  if(!DB.people||!DB.people.length){seed();return;}
  if(!DB.templates)DB.templates={};
  if(DB.threshold==null)DB.threshold=5;
  if(!DB.notifyDays)DB.notifyDays=[1,2,3,4,5];
  if(!DB.edges)DB.edges=[];
  if(!DB.qualities)DB.qualities=[];
  if(DB.orders)DB.orders.forEach(o=>{ if(!o.links)o.links=[]; if(!o.comments)o.comments=[]; if(o.marca===undefined)o.marca=''; if(o.width===undefined)o.width=''; if(o.totalQty===undefined)o.totalQty=''; if(o.selvedge===undefined)o.selvedge=''; if(o.containerNo===undefined)o.containerNo=''; });
  if(DB.tasks)DB.tasks.forEach(t=>{ (t.comments||[]).forEach(c=>{ if(c.acked===undefined)c.acked=true; }); });
  if(DB.tasks)DB.tasks.forEach(t=>{ if(!t.reminders)t.reminders=[]; if(!t.comments)t.comments=[]; });

  // get an onboarding tour forced on them — only genuinely new people see it
  DB.people.forEach(p=>{ if(p.tutorialSeen===undefined)p.tutorialSeen=true; });
  PEOPLE=DB.people;
}
function fallbackOwner(){return (PEOPLE.find(p=>p.boss)||PEOPLE[0]||{name:'—'}).name;}

/* ===== graph utilities (shared by templates + live order graphs; unit-tested) ===== */
function computeRanks(taskIds, edges){
  const indeg=new Map(taskIds.map(id=>[id,0]));
  const adj=new Map(taskIds.map(id=>[id,[]]));
  edges.forEach(e=>{ if(indeg.has(e.to))indeg.set(e.to,indeg.get(e.to)+1); if(adj.has(e.from))adj.get(e.from).push(e.to); });
  const rank=new Map(taskIds.map(id=>[id,0]));
  const indegWork=new Map(indeg);
  const queue=taskIds.filter(id=>indeg.get(id)===0);
  let qi=0;
  while(qi<queue.length){ const id=queue[qi++];
    adj.get(id).forEach(nid=>{ rank.set(nid,Math.max(rank.get(nid),rank.get(id)+1)); indegWork.set(nid,indegWork.get(nid)-1);
      if(indegWork.get(nid)===0)queue.push(nid); }); }
  return rank;
}
function reachable(fromId,edges){
  const adj={}; edges.forEach(e=>{(adj[e.from]=adj[e.from]||[]).push(e.to);});
  const seen=new Set(); const q=[fromId];
  while(q.length){ const id=q.shift(); (adj[id]||[]).forEach(n=>{if(!seen.has(n)){seen.add(n);q.push(n);}}); }
  return seen;
}
function wouldCreateCycle(edges,fromId,toId){ if(fromId===toId)return true; return reachable(toId,edges).has(fromId); }
function computePlannedStarts(tasks,edges,startISO){
  const byId=new Map(tasks.map(t=>[t.id,t]));
  const ranks=computeRanks(tasks.map(t=>t.id),edges);
  const order=[...tasks].sort((a,b)=>ranks.get(a.id)-ranks.get(b.id));
  const planned=new Map();
  order.forEach(t=>{
    const preds=edges.filter(e=>e.to===t.id);
    if(!preds.length){ planned.set(t.id,startISO); return; }
    let release=null;
    preds.forEach(e=>{ const p=byId.get(e.from); const pStart=parseD(planned.get(e.from));
      const r=e.type==='SS'?pStart:addDays(pStart,p.days); if(release===null||r>release)release=r; });
    planned.set(t.id,fmtISO(release));
  });
  return planned;
}
function seqNumbers(taskIds,edges){
  const ranks=computeRanks(taskIds,edges);
  const order=[...taskIds].sort((a,b)=>(ranks.get(a)-ranks.get(b))||(taskIds.indexOf(a)-taskIds.indexOf(b)));
  const m=new Map(); order.forEach((id,i)=>m.set(id,i+1)); return m;
}

/* ===== order creation ===== */
function makeOrder(code,style,category,startISO,shipISO,marca,width,totalQty,selvedge,containerNo){
  const oid=crypto.randomUUID();
  const tpl=DB.templates[category];
  DB.orders.push({id:oid,code,client:code.split('-')[0],style,category,start:startISO,ship:shipISO,links:[],comments:[],
    marca:marca||'',width:width||'',totalQty:totalQty||'',selvedge:selvedge||'',containerNo:containerNo||''});
  const idMap={};
  tpl.tasks.forEach(t=>{
    const newId=crypto.randomUUID(); idMap[t.id]=newId;
    const owner=PEOPLE.some(p=>p.name===t.owner)?t.owner:fallbackOwner();
    DB.tasks.push({id:newId,oid,name:t.name,owner,days:Math.max(1,t.days||1),
      status:'pending',actualStart:null,actualEnd:null,plannedStart:null,comments:[],reminders:[]});
  });
  tpl.edges.forEach(e=>{ DB.edges.push({id:crypto.randomUUID(),oid,from:idMap[e.from],to:idMap[e.to],type:e.type}); });
  recomputePlanned(oid,false);
  syncNewOrder(oid);
  return oid;
}
// Creates the order, its tasks and their edges on Supabase using the SAME ids already
// assigned locally (generated client-side via crypto.randomUUID), so there's no id swap
// afterward and no window where a button could reference an id that no longer matches —
// the exact bug this replaced, caught by testing before shipping.
async function syncNewOrder(oid){
  const o=DB.orders.find(x=>x.id===oid); if(!o)return;
  const chainLabel=(DB.templates[o.category]||{}).label||'';
  await sbInsert('orders',{id:oid,code:o.code,client:o.client,quality:o.style,chain_id:o.category,
    chain_label_snapshot:chainLabel,start_date:o.start,ship_date:o.ship,marca:o.marca,width:o.width,total_qty:o.totalQty,
    selvedge:o.selvedge,container_no:o.containerNo});
  const localTasks=DB.tasks.filter(t=>t.oid===oid);
  await Promise.all(localTasks.map(t=>sbInsert('tasks',{id:t.id,order_id:oid,name:t.name,owner_name:t.owner,days:t.days,
    status:t.status,actual_start:t.actualStart,actual_end:t.actualEnd,planned_start:t.plannedStart})));
  const localEdges=DB.edges.filter(e=>e.oid===oid);
  await Promise.all(localEdges.map(e=>sbInsert('task_edges',{id:e.id,order_id:oid,from_task:e.from,to_task:e.to,edge_type:e.type})));
}
// Recompute the frozen "initial plan" line. onlyPending=true leaves tasks that have already
// started/finished untouched (their frozen plannedStart is a historical record); the not-yet-
// started tail gets its plannedStart (re)computed from the current chain.
function recomputePlanned(oid,onlyPending){
  const o=ordOf(oid);
  const tasks=DB.tasks.filter(t=>t.oid===oid);
  const edges=DB.edges.filter(e=>e.oid===oid);
  const planned=computePlannedStarts(tasks,edges,o.start);
  tasks.forEach(t=>{
    if(onlyPending&&t.status!=='pending'&&t.plannedStart)return;
    t.plannedStart=planned.get(t.id);
  });
}
const plannedEnd=t=>fmtISO(addDays(parseD(t.plannedStart),t.days));

function seed(){
  DB={people:SEED_PEOPLE.map(p=>({...p})),templates:{},orders:[],tasks:[],edges:[],seq:1,threshold:5,
    qualities:[]};
  PEOPLE=DB.people;
  save();
}

/* ===== live dependency status ===== */
const ordOf=id=>DB.orders.find(o=>o.id===id);
function inEdges(id){return DB.edges.filter(e=>e.to===id);}
function outEdges(id){return DB.edges.filter(e=>e.from===id);}
function unlockInfo(t){
  const preds=inEdges(t.id);
  if(!preds.length)return{unlocked:true,since:ordOf(t.oid).start,blockedBy:[]};
  let since=null,blocked=[];
  preds.forEach(e=>{
    const p=DB.tasks.find(x=>x.id===e.from);
    const releasedAt=e.type==='SS'?p.actualStart:p.actualEnd;
    if(!releasedAt)blocked.push({task:p,needs:e.type==='SS'?'starts':'finishes'});
    else{const d=parseD(releasedAt); if(since===null||d>since)since=d;}
  });
  return{unlocked:blocked.length===0,since:since?fmtISO(since):null,blockedBy:blocked};
}
function taskPhase(t){
  if(t.status==='completed')return'done';
  if(t.status==='in_progress')return'inprog';
  return unlockInfo(t).unlocked?'ready':'locked';
}
function overdueRunningDays(t){
  if(t.status!=='in_progress'||!t.actualStart)return 0;
  const d=-daysFromToday(fmtISO(addDays(parseD(t.actualStart),t.days))); return d>0?d:0;
}
function idleDaysOf(t){
  if(t.status!=='pending')return 0;
  const u=unlockInfo(t); if(!u.unlocked)return 0;
  const d=-daysFromToday(u.since); return d>0?d:0;
}
function isDoneLate(t){ return t.status==='completed'&&t.actualStart&&t.actualEnd&&Math.round((parseD(t.actualEnd)-parseD(t.actualStart))/DAY)>t.days; }
function doneLateDays(t){ return Math.round((parseD(t.actualEnd)-parseD(t.actualStart))/DAY)-t.days; }

const SM={
  done:{l:'Done',c:'b-done',v:'var(--green)'},
  donelate:{l:'Done late',c:'b-soon',v:'var(--orange)'},
  overdue:{l:'In progress, late',c:'b-overdue',v:'var(--red)'},
  inprog:{l:'In progress',c:'b-prog',v:'var(--blue)'},
  idle:{l:'Not started',c:'b-idle',v:'var(--idle)'},
  ready:{l:'Ready to start',c:'b-pending',v:'var(--ink2)'},
  locked:{l:'Upcoming',c:'b-locked',v:'var(--muted)'},
};
function statusOf(t){
  if(t.status==='completed')return isDoneLate(t)?'donelate':'done';
  if(t.status==='in_progress')return overdueRunningDays(t)>0?'overdue':'inprog';
  const ph=taskPhase(t);
  if(ph==='locked')return'locked';
  return idleDaysOf(t)>0?'idle':'ready';
}

/* ===== comments ===== */
function canEditComment(c){ return ME.boss||c.author===ME.name; }
function needsAck(t,c){ return c.author!==t.owner && !c.acked && t.status!=='completed'; }
function addComment(taskId,text){
  const t=DB.tasks.find(x=>x.id===taskId); if(!t||!text.trim())return;
  const c={id:crypto.randomUUID(),text:text.trim(),author:ME.name,ts:nowStamp(),editedAt:null,acked:ME.name===t.owner};
  t.comments.push(c);
  save();
  sbInsert('task_comments',{id:c.id,task_id:taskId,text:c.text,author:c.author,acked:c.acked});
  if(ME.name===t.owner){ // replying implies you've seen what came before — ack everything and sync it
    t.comments.forEach(cm=>{ if(!cm.acked){ cm.acked=true; sbUpdate('task_comments',cm.id,{acked:true}); } });
    save();
  }
}
function acknowledgeComment(taskId,cid){
  const t=DB.tasks.find(x=>x.id===taskId); const c=t.comments.find(x=>x.id===cid); if(!c)return;
  if(ME.name!==t.owner&&!ME.boss)return;
  c.acked=true; save();
  sbUpdate('task_comments',cid,{acked:true});
}
function editComment(taskId,cid,text){
  const t=DB.tasks.find(x=>x.id===taskId); const c=t.comments.find(x=>x.id===cid); if(!c||!text.trim())return;
  c.text=text.trim(); c.editedAt=nowStamp(); save();
  sbUpdate('task_comments',cid,{text:c.text,edited_at:c.editedAt});
}

/* ===== order-level comments — same pattern as task comments, but an order has no single
   "owner" to route acknowledgement to, so any admin acknowledging counts ===== */
function canEditOrderComment(c){ return ME.boss||c.author===ME.name; }
function needsAckOrderComment(c){ return !c.acked; }
function addOrderComment(oid,text){
  const o=ordOf(oid); if(!o||!text.trim())return;
  const c={id:crypto.randomUUID(),text:text.trim(),author:ME.name,ts:nowStamp(),editedAt:null,acked:ME.boss};
  o.comments.push(c);
  save();
  sbInsert('order_comments',{id:c.id,order_id:oid,text:c.text,author:c.author,acked:c.acked});

    o.comments.forEach(cm=>{ if(!cm.acked){ cm.acked=true; sbUpdate('order_comments',cm.id,{acked:true}); } });
    save();
  }
}
function acknowledgeOrderComment(oid,cid){
  const o=ordOf(oid); const c=o&&o.comments.find(x=>x.id===cid); if(!c||!ME.boss)return;
  c.acked=true; save();
  sbUpdate('order_comments',cid,{acked:true});
}
function editOrderComment(oid,cid,text){
  const o=ordOf(oid); const c=o&&o.comments.find(x=>x.id===cid); if(!c||!text.trim())return;
  c.text=text.trim(); c.editedAt=nowStamp(); save();
  sbUpdate('order_comments',cid,{text:c.text,edited_at:c.editedAt});
}

/* ===== reminders =====
   Distinct from comments: anyone on the team can leave one for whoever holds the task,
   it carries a due date, and it has its own open/resolved lifecycle. Resolving never
   deletes it — it just gets marked resolved and stays visible for reference. */
function canResolveReminder(t,r){ return ME.boss||t.owner===ME.name||r.createdBy===ME.name; }
function addReminder(taskId,text,dueDate){
  const t=DB.tasks.find(x=>x.id===taskId); if(!t||!text.trim()||!dueDate)return;
  const r={id:crypto.randomUUID(),text:text.trim(),dueDate,createdBy:ME.name,createdAt:nowStamp(),
    status:'open',resolvedAt:null,resolvedBy:null,resolvedVia:null,replyCommentId:null};
  t.reminders.push(r);
  save();
  sbInsert('task_reminders',{id:r.id,task_id:taskId,text:r.text,due_date:r.dueDate,created_by:r.createdBy});
}
function resolveReminder(taskId,rid,via){
  const t=DB.tasks.find(x=>x.id===taskId); const r=t&&t.reminders.find(x=>x.id===rid);
  if(!r||r.status==='resolved')return;
  r.status='resolved'; r.resolvedAt=nowStamp(); r.resolvedBy=ME.name; r.resolvedVia=via||'manual';
  save();
  sbUpdate('task_reminders',rid,{status:r.status,resolved_at:r.resolvedAt,resolved_by:r.resolvedBy,resolved_via:r.resolvedVia});
}
// a reply both adds a normal comment AND resolves the reminder it's answering, linked together
function replyToReminder(taskId,rid,text){
  const t=DB.tasks.find(x=>x.id===taskId); const r=t&&t.reminders.find(x=>x.id===rid);
  if(!t||!r||!text.trim())return;
  const c={id:crypto.randomUUID(),text:text.trim(),author:ME.name,ts:nowStamp(),editedAt:null,acked:ME.name===t.owner};
  t.comments.push(c);
  if(ME.name===t.owner) t.comments.forEach(cm=>{cm.acked=true;});
  r.status='resolved'; r.resolvedAt=nowStamp(); r.resolvedBy=ME.name; r.resolvedVia='comment'; r.replyCommentId=c.id;
  save();
  sbInsert('task_comments',{id:c.id,task_id:taskId,text:c.text,author:c.author,acked:c.acked});
  sbUpdate('task_reminders',rid,{status:r.status,resolved_at:r.resolvedAt,resolved_by:r.resolvedBy,resolved_via:r.resolvedVia,reply_comment_id:r.replyCommentId});
}
// auto-resolve every still-open reminder on a task the moment it's marked done
function autoResolveReminders(t){
  t.reminders.filter(r=>r.status==='open').forEach(r=>{
    r.status='resolved'; r.resolvedAt=nowStamp(); r.resolvedBy=ME.name; r.resolvedVia='auto-done';
  });
}
function reminderState(r){ // 'resolved' | 'overdue' | 'due-today' | 'upcoming'
  if(r.status==='resolved')return'resolved';
  const d=daysFromToday(r.dueDate);
  if(d<0)return'overdue'; if(d===0)return'due-today'; return'upcoming';
}
const RSM={
  overdue:{l:'Overdue',c:'b-overdue',v:'var(--red)'},
  'due-today':{l:'Due today',c:'b-idle',v:'var(--idle)'},
  upcoming:{l:'Upcoming',c:'b-pending',v:'var(--ink2)'},
  resolved:{l:'Resolved',c:'b-done',v:'var(--green)'},
};
const allOpenReminders=()=>{
  const out=[];
  DB.tasks.forEach(t=>t.reminders.forEach(r=>{ if(r.status==='open') out.push({r,t}); }));
  return out;
};
const dueOrOverdueReminders=()=>allOpenReminders().filter(({r})=>daysFromToday(r.dueDate)<=0);

/* ===== mutability rules =====
   A task's own attributes (name/owner/days) stay editable up until it's marked Done — once
   Done, it's locked so the record can't be rewritten after the fact. Its incoming dependency
   edges (what unlocks it) lock a step earlier, at Start — once a task has actually begun, the
   question of what unlocked it has already been answered, so rewiring it further is disabled. */
function canEditAttrs(t){return ME.boss||t.status!=='completed';}
function canEditIncoming(t){return ME.boss||t.status==='pending';}

/* ---- name dropdown + password sign-in, backed by real Supabase auth ---- */
function renderLoginOptions(){
  const step1=document.getElementById('loginStep1');
  if(PEOPLE.length===0){
    step1.innerHTML=`
      <p class="mh-sub" style="text-align:center;margin-bottom:14px">No one is set up yet — create the first admin account to get started.</p>
      <label class="lf-label">Your name</label>
      <input type="text" id="bootstrapName" class="lf-input">
      <label class="lf-label" style="margin-top:14px">Choose a password</label>
      <input type="password" id="loginPassword" class="lf-input" onkeydown="if(event.key==='Enter')bootstrapFirstAdmin()">
      <button class="lf-btn" onclick="bootstrapFirstAdmin()">Create admin account</button>
      <div id="err1" class="lf-err"></div>`;
    return;
  }
  step1.innerHTML=`
    <label class="lf-label">Select your name</label>
    <select id="loginUser" class="lf-input" onchange="updateLoginHint()"></select>
    <label class="lf-label" style="margin-top:14px">Password</label>
    <input type="password" id="loginPassword" class="lf-input" onkeydown="if(event.key==='Enter')attemptLogin()">
    <div id="loginHint" class="lf-hint"></div>
    <button class="lf-btn" onclick="attemptLogin()">Sign in</button>
    <div id="err1" class="lf-err"></div>`;
  const sel=document.getElementById('loginUser');
  sel.innerHTML=PEOPLE.map(p=>`<option value="${p.name}">${p.name}${p.boss?' · Admin':''}</option>`).join('');
  updateLoginHint();
}
function updateLoginHint(){
  const p=PEOPLE.find(x=>x.name===document.getElementById('loginUser').value);
  const hint=document.getElementById('loginHint');
  if(!hint)return;
  hint.textContent = p&&!p.authUserId ? 'First time signing in — choose a password to create your account.' : '';
}
// Recovery path for a completely empty team — e.g. if every person was ever deleted, or a
// fresh database with no seed data run. Self-limiting: the matching RLS policy only allows
// this unauthenticated insert while the people table is genuinely empty, and it closes the
// moment this first row exists, same as any normal add-person action from then on.
async function bootstrapFirstAdmin(){
  const name=document.getElementById('bootstrapName').value.trim();
  const pw=document.getElementById('loginPassword').value;
  const err=document.getElementById('err1');
  if(!name){err.textContent='Enter your name.';return;}
  if(!pw||pw.length<6){err.textContent='Password must be at least 6 characters.';return;}
  err.textContent='Setting up…';
  const row=await sbInsert('people',{name,is_admin:true,color:nextColor(),tutorial_seen:false});
  if(!row){err.textContent='Could not create the account — check your connection and try again.';return;}
  const result=await sbSignUp(row.id,pw);
  if(result.error){err.textContent='Account created, but sign-in failed: '+result.error.message;return;}
  await loadFromSupabase();
  const freshP=PEOPLE.find(p=>p.id===row.id);
  if(!freshP){err.textContent='Signed in, but could not find the new profile — reload and try again.';return;}
  err.textContent='';
  setupRealtime();
  login(freshP.name);
}
async function attemptLogin(){
  const p=PEOPLE.find(x=>x.name===document.getElementById('loginUser').value);
  const pw=document.getElementById('loginPassword').value;
  const err=document.getElementById('err1');
  if(!p){err.textContent='Please pick a name.';return;}
  if(!pw||pw.length<6){err.textContent='Password must be at least 6 characters.';return;}
  err.textContent='Signing in…';
  const result = p.authUserId ? await sbSignIn(p.id,pw) : await sbSignUp(p.id,pw);
  if(result.error){ err.textContent = p.authUserId ? 'Incorrect password.' : ('Could not create account: '+result.error.message); return; }
  await loadFromSupabase();
  const freshP=PEOPLE.find(x=>x.name===p.name);
  if(!freshP){ err.textContent='Signed in, but could not find your profile — ask an admin.'; return; }
  err.textContent='';
  setupRealtime();
  login(freshP.name);
}
function toast(m){const t=document.getElementById('lfToast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}

function login(n){ME=PEOPLE.find(p=>p.name===n);
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const a=document.getElementById('hdrAvatar');a.style.background=personColor(n);a.textContent=initials(n);
  document.getElementById('navTeam').style.display=ME.boss?'flex':'none';
  switchTab('dash');window.scrollTo(0,0);
  if(!ME.tutorialSeen) startTutorial();
  setTimeout(setupPushNotifications, 4000);
}
async function logout(){ME=null; await sbSignOut();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  renderLoginOptions();
  document.getElementById('loginPassword').value='';
  document.getElementById('err1').textContent='';
}

function tutStepData(key){ return TUT_STEP_TEXT[TUT_LANG][key]; }
function renderTutStep(){
  if(!TUT_ACTIVE)return;
  const key=TUT_KEYS[TUT_IDX], s=tutStepData(key), last=TUT_IDX===TUT_KEYS.length-1;

  if(!tip){ tip=document.createElement('div'); tip.id='tutTip'; document.body.appendChild(tip); }

      <span onclick="endTutorial()" title="End tour" style="position:absolute;right:-4px;top:-4px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;font-size:16px;line-height:1">×</span>
    </div>
    <div style="display:flex;gap:10px;align-items:flex-start;margin-top:10px">

    </div>
    ${!arrived?`<div style="text-align:center;font-size:20px;margin-top:6px;animation:tutBounce 1s infinite">⌄</div>`:''}

function tutorialNext(){ TUT_IDX=Math.min(TUT_KEYS.length-1,TUT_IDX+1); renderTutStep(); }
function tutorialBack(){ TUT_IDX=Math.max(0,TUT_IDX-1); renderTutStep(); }
function endTutorial(){

  sbUpdate('people',ME.id,{tutorial_seen:true});
  const dim=document.getElementById('tutDim'); if(dim)dim.remove();
  const tip=document.getElementById('tutTip'); if(tip)tip.remove();

function switchTab(tab){TAB=tab;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ['mine','orders','dash','team'].forEach(v=>document.getElementById('view-'+v).classList.toggle('hidden',v!==tab));
  updateFab();
  document.getElementById('hdrSub').textContent={mine:'My tasks',orders:'All orders',dash:'Dashboard',team:'Admin'}[tab];
  if(tab==='mine')renderMine(); if(tab==='orders')renderOrders(); if(tab==='dash')renderDash(); if(tab==='team')renderTeam();
  window.scrollTo(0,0);
  if(TUT_ACTIVE){ const s=tutStepData(TUT_KEYS[TUT_IDX]); if(s&&s.gotoTab===tab) renderTutStep(); }
}
function updateFab(){document.getElementById('fab').classList.toggle('hidden',
  !(ME&&ME.boss&&(TAB==='mine'||TAB==='orders')));}

/* ================= MY TASKS ================= */
function renderMine(){
  const mine=DB.tasks.filter(t=>t.owner===ME.name);
  const open=mine.filter(t=>t.status!=='completed');
  const doneL=mine.filter(t=>t.status==='completed');
  const pr={overdue:0,idle:1,inprog:2,ready:3,locked:4};
  open.sort((a,b)=>pr[statusOf(a)]-pr[statusOf(b)]);
  const late=open.filter(t=>statusOf(t)==='overdue').length;
  const idle=open.filter(t=>statusOf(t)==='idle').length;
  const el=document.getElementById('view-mine');
  let h=`<h2 class="vt">Hi ${ME.name}</h2>
    <p class="sub">${open.length} open task${open.length!==1?'s':''}${late?` · <span style="color:var(--red)">${late} running late</span>`:''}${idle?` · <span style="color:var(--idle)">${idle} not started</span>`:''}</p>`;
  if(!mine.length){h+=`<div class="empty"><div class="big">✓</div>No tasks assigned to you yet.</div>`;}
  else{
    if(open.length){h+=`<div class="grp-h">To do <span class="cnt">${open.length}</span></div>`+open.map(t=>taskCard(t)).join('');}
    if(doneL.length){h+=`<div class="grp-h">Completed <span class="cnt">${doneL.length}</span></div>`+doneL.map(t=>taskCard(t)).join('');}
  }
  el.innerHTML=h;
}
function taskCard(t){
  const o=ordOf(t.oid), s=statusOf(t), m=SM[s];
  let due;
  if(s==='done'){ due=`Done ${fmtNice(t.actualEnd)}`; }
  else if(s==='donelate'){ due=`Done ${fmtNice(t.actualEnd)} · ${doneLateDays(t)}d late`; }
  else if(s==='overdue'){ due=`${t.days}d allowed, now ${overdueRunningDays(t)}d late`; }
  else if(s==='inprog'){ due=`Started ${fmtNice(t.actualStart)} · ${t.days}d allowed`; }
  else if(s==='idle'){ due=`Not started for ${idleDaysOf(t)}d · ${t.days}d allowed`; }
  else if(s==='ready'){ due=`${t.days}d allowed`; }
  else{ const u=unlockInfo(t); due=`Starts after ${u.blockedBy.map(b=>`${b.task.name} ${b.needs}`).join(', ')}`; }
  return `<div class="task tap" style="--st:${m.v};${s==='locked'?'opacity:.6':''}" onclick="openTask('${t.id}')">
    <div class="top">
      <div style="flex:1;min-width:0">
        <div class="tname">${t.name}</div>
        <div class="tmeta"><span class="chip order">${o.code}</span><span>${o.style.split('·')[0].trim()}</span></div>
      </div>
      <span class="badge ${m.c}">${m.l}</span>
    </div>
    <div class="tmeta" style="margin-top:9px;justify-content:space-between">
      <span class="owner-pill"><span class="avatar" style="background:${personColor(t.owner)}">${initials(t.owner)}</span>${t.owner}</span>
      <span class="due" style="color:${m.v}">${due}</span>
    </div>
  </div>`;
}

/* ================= ORDERS ================= */
let ORDER_Q='';
const isOrderDone=oid=>{const ts=DB.tasks.filter(t=>t.oid===oid);return ts.length&&ts.every(t=>t.status==='completed');};
const orderCompletedDate=oid=>{const a=DB.tasks.filter(t=>t.oid===oid&&t.actualEnd).map(t=>t.actualEnd).sort();return a[a.length-1];};
const orderCommentCount=oid=>{const o=ordOf(oid);return (o?o.comments.length:0)+DB.tasks.filter(t=>t.oid===oid).reduce((s,t)=>s+t.comments.length,0);};

function renderOrders(){
  document.getElementById('view-orders').innerHTML=`<h2 class="vt">All Orders</h2><p class="sub">Search by client or order number · tap to open.</p>
    ${ME.boss?`<button class="btn" style="width:100%;margin-bottom:8px" onclick="openTemplateList()">⚙️ Edit standard processes ›</button>
    <button class="btn" style="width:100%;margin-bottom:8px" onclick="openQualitiesList()">📋 Manage qualities ›</button>`:''}
    <button class="btn" style="width:100%;margin-bottom:14px" onclick="downloadReport()">📄 Download report (.xlsx)</button>
    <input class="search" placeholder="Search by client or order number…" value="${ORDER_Q.replace(/"/g,'&quot;')}" oninput="ORDER_Q=this.value;drawCards()">
    <div id="ordList"></div>`;
  drawCards();
}
function downloadReport(){
  const rows=[['REPORT'],[],['PROGRAM','SS NO.','WIDTH','MARCA','QUALITY','ORDERED QTTY','SELVEDGE','CONTAINER NO.','STATUS (DISPATCHED/RUNNING)']];
  DB.orders.slice().sort((a,b)=>a.start.localeCompare(b.start)).forEach(o=>{
    const ssNo=o.code.slice(o.client.length+1);
    const status=isOrderDone(o.id)?'DISPATCHED':'RUNNING';
    rows.push([o.client,ssNo,o.width||'',o.marca||'',o.style||'',o.totalQty||'',o.selvedge||'',o.containerNo||'',status]);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:10},{wch:10},{wch:14},{wch:22},{wch:14},{wch:12},{wch:14},{wch:26}];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:8}}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Report');
  XLSX.writeFile(wb,`Amber-Report-${fmtISO(today())}.xlsx`);
}

function addQuality(){
  const v=document.getElementById('new-quality').value.trim();
  if(!v){alert('Enter a quality name.');return;}
  if(DB.qualities.includes(v)){alert('That quality already exists.');return;}
  DB.qualities.push(v); save(); openQualitiesList();
  sbInsert('qualities',{name:v});
}
function removeQuality(i){
  if(!confirm('Remove this quality from the list? Existing orders keep their quality text either way.'))return;
  const v=DB.qualities[i];
  DB.qualities.splice(i,1); save(); openQualitiesList();
  sb.from('qualities').delete().eq('name',v);
}
function drawCards(){
  const q=ORDER_Q.toLowerCase();
  let list=DB.orders.filter(o=>!q||o.code.toLowerCase().includes(q)||o.style.toLowerCase().includes(q));
  list=list.map(o=>({o,d:isOrderDone(o.id)?1:0})).sort((a,b)=>a.d-b.d||b.o.start.localeCompare(a.o.start)).map(x=>x.o);
  const box=document.getElementById('ordList'); if(!box)return;
  const emptyMsg = DB.orders.length===0
    ? `No orders yet ${ME&&ME.boss?'— tap + below to create the first one.':'— an admin needs to create the first one.'}`
    : 'No orders match your search.';
  box.innerHTML=list.length?list.map(orderCard).join(''):`<div class="empty">${emptyMsg}</div>`;
}
function orderCard(o){
  const ts=DB.tasks.filter(t=>t.oid===o.id),dn=ts.filter(t=>t.status==='completed').length;
  const iss=ts.filter(t=>['overdue','idle'].includes(statusOf(t))).length,pct=Math.round(dn/ts.length*100),done=dn===ts.length;
  const lt=ts.filter(isDoneLate).length;
  const cc=orderCommentCount(o.id);
  const catLabel=(DB.templates[o.category]||{}).label||o.category;
  return `<div class="order-card tap" onclick="openOrder('${o.id}')">
    <div class="oc-top"><div style="flex:1"><div class="oc-code">${o.code} <span class="cat-chip">${catLabel}</span></div><div class="oc-style">${o.style}</div></div>
      ${done?`<span class="badge b-done">✓ Done</span>`:`<span class="badge b-prog">${pct}%</span>`}</div>
    <div class="bar"><i style="width:${pct}%${done?';background:var(--green)':''}"></i></div>
    <div class="oc-stats"><span><b>${dn}</b>/${ts.length} done</span>
      ${iss?`<span style="color:var(--red)"><b>${iss}</b> need attention</span>`:''}
      ${lt?`<span style="color:var(--orange)"><b>${lt}</b> done late</span>`:''}
      ${cc?`<span class="cmt-chip">💬 ${cc}</span>`:''}
      <span>${done?`Completed <b>${fmtNice(orderCompletedDate(o.id))}</b>`:`Ship <b>${fmtNice(o.ship)}</b>`}</span></div>
  </div>`;
}
let CURRENT_OPEN_OID=null;
function openOrder(oid){
  const o=ordOf(oid);
  if(!o){ CURRENT_OPEN_OID=null; return; } // order not found under this id right now — most likely mid background-sync; caller retries after reconciliation
  CURRENT_OPEN_OID=oid;
  const ids=DB.tasks.filter(t=>t.oid===oid).map(t=>t.id);
  const edges=DB.edges.filter(e=>e.oid===oid);
  const seq=seqNumbers(ids,edges);
  const ts=DB.tasks.filter(t=>t.oid===oid).sort((a,b)=>seq.get(a.id)-seq.get(b.id));
  const dn=ts.filter(t=>t.status==='completed').length;
  const cc=orderCommentCount(oid);
  const catLabel=(DB.templates[o.category]||{}).label||o.category;
  const extras=[o.marca?`Marca: ${o.marca}`:'',o.width?`Width: ${o.width}`:'',o.totalQty?`Qtty: ${o.totalQty}`:'',o.selvedge?`Selvedge: ${o.selvedge}`:'',o.containerNo?`Container: ${o.containerNo}`:''].filter(Boolean).join(' · ');
  const orderCommentsBlock=`<div class="field" style="margin-bottom:14px"><label>Comments</label>
    ${o.comments.length?o.comments.slice().reverse().map(c=>{
      const unacked=needsAckOrderComment(c);
      return `<div class="cmt" id="ocmt-${c.id}">
        <div class="cmt-head"><span>${c.author} · ${fmtStamp(c.ts)}${c.editedAt?' (edited)':''}</span>${unacked?`<span class="badge b-idle" style="font-size:9.5px;padding:2px 7px">Not yet seen</span>`:''}</div>
        <div class="cmt-body">${c.text.replace(/</g,'&lt;')}</div>
        <div style="display:flex;gap:14px;margin-top:2px">
          ${canEditOrderComment(c)?`<div class="cmt-edit" onclick="startEditOrderComment('${oid}','${c.id}')">Edit</div>`:''}
          ${unacked&&ME.boss?`<div class="cmt-edit" onclick="acknowledgeOrderComment('${oid}','${c.id}');openOrder('${oid}')">Acknowledge</div>`:''}
        </div>
      </div>`;}).join(''):`<p class="waiting" style="margin:0 0 8px">No comments yet.</p>`}
    <textarea class="note" id="newOrderComment" placeholder="Add an update…" rows="2"></textarea>
    <button class="btn" style="width:100%;margin-top:8px" onclick="submitOrderComment('${oid}')">Add comment</button>
  </div>`;
  const body=`<div class="grab"></div>
    <h3>${o.code}${isOrderDone(oid)?' <span class="badge b-done" style="vertical-align:middle">✓ Done</span>':''}</h3>
    <p class="mh-sub"><span class="cat-chip">${catLabel}</span> &nbsp;${o.style} · start ${fmtNice(o.start)} · ship ${fmtNice(o.ship)}</p>
    ${extras?`<p class="mh-sub" style="margin-top:2px">${extras}</p>`:''}
    <div class="bar" style="margin-bottom:5px"><i style="width:${Math.round(dn/ts.length*100)}%${isOrderDone(oid)?';background:var(--green)':''}"></i></div>
    <p class="mh-sub">${dn}/${ts.length} tasks complete${cc?` · <span class="cmt-chip">💬 ${cc} comment${cc!==1?'s':''}</span>`:''}</p>
    <div class="row-btns" style="margin-bottom:14px">
      <button class="btn" onclick="openChart('${oid}')">Planned vs actual</button>
      <button class="btn" onclick="openFlowchart('order','${oid}')">Process map</button>
    </div>
    <div class="field" style="margin-bottom:14px"><label>Links</label>
      ${o.links.length?o.links.map(l=>`<div class="dep-row"><a href="${l.url.replace(/"/g,'&quot;')}" target="_blank" rel="noopener noreferrer" style="flex:1;min-width:0;color:var(--blue);font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block">🔗 ${(l.label||l.url).replace(/</g,'&lt;')}</a><span onclick="removeOrderLink('${oid}','${l.id}')" style="color:var(--red);cursor:pointer;font-size:13px;font-weight:600;padding:4px 8px;flex-shrink:0">Remove</span></div>`).join(''):'<p class="waiting" style="margin:0 0 6px">No links yet.</p>'}
      <button class="btn" style="width:100%;margin-top:8px" onclick="openAddLink('${oid}')">+ Add a link (Google Drive, etc.)</button>
    </div>
    ${orderCommentsBlock}
    <p class="waiting" style="margin:0 0 10px">Tap a task to open it · press and hold to peek at its comments.</p>
    ${ts.map(t=>{const s=statusOf(t),m=SM[s];
      let meta;
      if(t.status==='completed') meta=`· done ${fmtNice(t.actualEnd)}${s==='donelate'?` <b style="color:var(--orange)">${doneLateDays(t)}d late</b>`:''}`;
      else if(t.status==='in_progress') meta=`· started ${fmtNice(t.actualStart)}${s==='overdue'?` <b style="color:var(--red)">${overdueRunningDays(t)}d late</b>`:''}`;
      else if(s==='locked') meta=`· starts after ${unlockInfo(t).blockedBy.map(b=>`${b.task.name} ${b.needs}`).join(', ')}`;
      else meta=`· ${t.days}d allowed${s==='idle'?` <b style="color:var(--idle)">not started for ${idleDaysOf(t)}d</b>`:''}`;
      const cCount=t.comments.length;
      const cChip=cCount?`<span class="cmt-chip">💬 ${cCount}</span>`:'';
      const expanded=EXPANDED_COMMENTS.has(t.id);
      return `<div class="task tap" style="--st:${m.v};margin-bottom:9px;${s==='locked'?'opacity:.6':''}"
          onpointerdown="lpStart('${t.id}')" onpointerup="lpEnd(event,'${t.id}','${oid}')" onpointerleave="lpCancel()" oncontextmenu="return false">
        <div class="top"><div style="flex:1;min-width:0"><div class="tname" style="font-size:14.5px">${seq.get(t.id)}. ${t.name} ${cChip}</div>
          <div class="tmeta" style="margin-top:6px"><span class="owner-pill"><span class="avatar" style="background:${personColor(t.owner)}">${initials(t.owner)}</span>${t.owner}</span><span>${meta}</span></div></div>
          <span class="badge ${m.c}">${m.l}</span></div>
        ${expanded?renderCommentTimeline(t):''}
      </div>`;}).join('')}
    ${ME.boss?`<button class="btn" style="margin-top:8px" onclick="openFlowchart('order','${oid}')">Edit this order's process</button>
    <button class="btn" style="margin-top:8px" onclick="openEditOrder('${oid}')">Edit order details</button>
    <button class="btn danger" style="margin-top:8px" onclick="promptDeleteOrder('${oid}')">Delete order</button>`:''}
    <button class="btn primary" style="margin-top:8px" onclick="closeModalRefresh()">Close</button>`;
  showSheet(body);
}

function saveEditOrder(oid){
  const o=ordOf(oid);
  const client=document.getElementById('eo-client').value.trim().toUpperCase();
  const num=document.getElementById('eo-num').value.trim();
  const marca=document.getElementById('eo-marca').value.trim();
  const width=document.getElementById('eo-width').value.trim();
  const selvedge=document.getElementById('eo-selvedge').value.trim();
  const containerNo=document.getElementById('eo-container').value.trim();
  const qty=document.getElementById('eo-qty').value.trim();
  const style=document.getElementById('eo-style').value.trim()||'—';
  const start=document.getElementById('eo-start').value;
  const ship=document.getElementById('eo-ship').value||null;
  if(!client||!num){alert('Enter a program code and SS no.');return;}
  if(!start){alert('Pick an order start date.');return;}
  const newCode=client+'-'+num;
  if(newCode!==o.code&&DB.orders.some(x=>x.code===newCode)){alert('Another order already uses that code.');return;}
  o.client=client; o.code=newCode; o.style=style; o.start=start; o.ship=ship;
  o.marca=marca; o.width=width; o.totalQty=qty; o.selvedge=selvedge; o.containerNo=containerNo;
  recomputePlanned(oid,true);
  save(); openOrder(oid);
  sbUpdate('orders',oid,{code:newCode,client,quality:style,start_date:start,ship_date:ship,marca,width,total_qty:qty,selvedge,container_no:containerNo});
  syncPlannedStarts(oid);
}
function promptDeleteOrder(oid){
  const o=ordOf(oid);
  const n=DB.tasks.filter(t=>t.oid===oid).length;
  if(!confirm(`Delete order ${o.code}? This permanently removes all ${n} of its tasks, comments, reminders, and links. This can't be undone.`))return;
  DB.tasks=DB.tasks.filter(t=>t.oid!==oid);
  DB.edges=DB.edges.filter(e=>e.oid!==oid);
  DB.orders=DB.orders.filter(x=>x.id!==oid);
  save(); closeModal(); switchTab('orders');
  sbDelete('orders',oid); // cascades tasks, task_edges, order_links, and their comments/reminders per the schema
}

function saveOrderLink(oid){

  if(!/^https?:\/\//i.test(url)) url='https://'+url;

  const l={id:crypto.randomUUID(),url,label,addedBy:ME.name,ts:nowStamp()};

function removeOrderLink(oid,lid){
  if(!confirm('Remove this link? (This only removes it from the tracker, not from Google Drive.)'))return;

  o.links=o.links.filter(l=>l.id!==lid);
  save(); openOrder(oid);
  sbDelete('order_links',lid);
}

/* ---- press-and-hold on a task row to peek at its comments without leaving the order ---- */
let EXPANDED_COMMENTS=new Set();
let LP_TIMER=null, LP_FIRED=false;
function lpStart(taskId){
  LP_FIRED=false;
  clearTimeout(LP_TIMER);
  LP_TIMER=setTimeout(()=>{ LP_FIRED=true; if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate(12); toggleTimeline(taskId); }, 480);
}
function lpEnd(e,taskId,oid){
  clearTimeout(LP_TIMER);
  if(LP_FIRED){ LP_FIRED=false; return; } // the long-press already acted — don't also open the task
  openTask(taskId,oid);
}
function lpCancel(){ clearTimeout(LP_TIMER); }
function toggleTimeline(taskId){
  if(EXPANDED_COMMENTS.has(taskId))EXPANDED_COMMENTS.delete(taskId); else EXPANDED_COMMENTS.add(taskId);
  const t=DB.tasks.find(x=>x.id===taskId); if(t)openOrder(t.oid);
}
function renderCommentTimeline(t){
  if(!t.comments.length) return `<div class="cmt-timeline"><p class="waiting" style="margin:6px 0 2px">No comments on this task yet.</p></div>`;
  const items=t.comments.slice().reverse().map(c=>`
      <div class="cmt-tl-item">
        <div class="cmt-tl-dot"></div>
        <div class="cmt-tl-body">
          <div class="cmt-tl-head">${c.author} · ${fmtStamp(c.ts)}${c.editedAt?' (edited)':''}</div>
          <div class="cmt-tl-text">${c.text.replace(/</g,'&lt;')}</div>
        </div>
      </div>`).join('');
  return `<div class="cmt-timeline">${items}</div>`;
}

/* ================= TASK EDITOR ================= */
function openTask(id,backOid){
  const t=DB.tasks.find(x=>x.id===id), o=ordOf(t.oid);
  const boss=ME.boss, mine=t.owner===ME.name, canAct=boss||mine;
  const s=statusOf(t), m=SM[s];
  const back=backOid?`openOrder('${backOid}')`:`closeModalRefresh()`;
  const u=unlockInfo(t);

  let statusLine;
  if(t.status==='completed') statusLine=`Done on ${fmtNice(t.actualEnd)}, started ${fmtNice(t.actualStart)}${s==='donelate'?` — <b style="color:var(--orange)">${doneLateDays(t)}d later than the ${t.days}d allowed</b>`:` — within the ${t.days}d allowed.`}`;
  else if(t.status==='in_progress') statusLine=`Started ${fmtNice(t.actualStart)}, ${t.days}d allowed${s==='overdue'?` — <b style="color:var(--red)">now ${overdueRunningDays(t)}d late</b>`:''}.`;
  else if(u.unlocked) statusLine=`Ready to start${idleDaysOf(t)>0?` — <b style="color:var(--idle)">not started for ${idleDaysOf(t)}d</b>`:''}. ${t.days}d allowed once started.`;
  else statusLine=`Upcoming — starts after <b>${u.blockedBy.map(b=>`${b.task.name} ${b.needs}`).join(', ')}</b>.`;

  let actions='';
  if(canAct){
    if(t.status==='pending'&&u.unlocked) actions+=`<button class="btn primary" style="width:100%" onclick="startTask('${t.id}','${backOid||''}')">Start task</button>`;
    else if(t.status==='in_progress') actions+=`<button class="btn primary" style="width:100%" onclick="finishTask('${t.id}','${backOid||''}')">Mark finished</button>`;
    if(boss&&t.status!=='pending') actions+=`<button class="btn" style="width:100%;margin-top:8px" onclick="reopenTask('${t.id}','${backOid||''}')">Reopen / undo</button>`;
  }
  if(boss&&t.status!=='completed') actions+=`<button class="btn" style="width:100%;margin-top:8px" onclick="forceCompleteTask('${t.id}','${backOid||''}')">Mark as done — skip the normal steps</button>`;

  let attrsBlock='';
  if(boss){
    const depRows=inEdges(t.id).map(e=>{const p=DB.tasks.find(x=>x.id===e.from);
      return `<div class="dep-row"><span class="dep-name">${p.name}</span><span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;background:var(--card2);color:${DEPT[e.type].color}">${DEPT[e.type].short}</span></div>`;}).join('');
    attrsBlock=`
    <div class="two">
      <div class="field"><label>Assigned to</label>
        <select id="edOwner" ${canEditAttrs(t)?'':'disabled'}>${PEOPLE.map(p=>`<option value="${p.name}" ${p.name===t.owner?'selected':''}>${p.name}</option>`).join('')}</select></div>
      <div class="field"><label>Days allowed</label><input id="edDays" type="number" min="1" value="${t.days}" ${canEditAttrs(t)?'':'disabled'}></div>
    </div>
    ${canEditAttrs(t)?`<button class="btn" style="width:100%;margin-bottom:14px" onclick="saveTaskAttrs('${t.id}','${backOid||''}')">Save changes</button>`:`<p class="waiting">Locked — this task is done.</p>`}
    <div class="field">
      <label>Starts after</label>
      ${depRows||`<p class="waiting" style="margin:4px 0">Starts right at the order's start date.</p>`}
      ${canEditIncoming(t)?`<button class="btn" style="width:100%;margin-top:8px" onclick="openDepEditor('${backOid||''}','${t.id}')">Edit dependencies</button>`
        :`<p class="waiting">Locked — this task has already started.</p>`}
    </div>`;
  }

  const remindersBlock=`
    <div class="field"><label>Reminders</label>
      ${t.reminders.length?t.reminders.slice().reverse().map(r=>{
        const rs=reminderState(r), rm=RSM[rs];
        const resolvedNote = r.status==='resolved' ? `<div class="waiting" style="margin-top:4px">Resolved ${fmtStamp(r.resolvedAt)} by ${r.resolvedBy}${r.resolvedVia==='auto-done'?' — task marked done':r.resolvedVia==='comment'?' — replied':''}</div>` : '';
        const canResolve = r.status==='open' && canResolveReminder(t,r);
        return `<div class="cmt" id="rem-${r.id}">
          <div class="cmt-head"><span>${r.createdBy} → ${t.owner} · for ${fmtNice(r.dueDate)}</span><span class="badge ${rm.c}" style="font-size:9.5px;padding:2px 7px">${rm.l}</span></div>
          <div class="cmt-body">${r.text.replace(/</g,'&lt;')}</div>
          ${resolvedNote}
          ${canResolve?`<div class="row-btns" style="margin-top:8px">
            <button class="btn" style="padding:9px" onclick="startReplyReminder('${t.id}','${r.id}','${backOid||''}')">Reply</button>
            <button class="btn" style="padding:9px" onclick="resolveReminderAndRefresh('${t.id}','${r.id}','${backOid||''}')">Mark resolved</button>
          </div>`:''}
        </div>`;
      }).join(''):`<p class="waiting" style="margin:0 0 8px">No reminders yet.</p>`}
      <button class="btn" style="width:100%;margin-top:8px" onclick="openReminderComposer('${t.id}','${backOid||''}')">+ Add reminder</button>
    </div>`;

  const commentsBlock=`
    <div class="field"><label>Comments</label>
      ${t.comments.length?t.comments.slice().reverse().map(c=>{
        const unacked=needsAck(t,c);
        return `<div class="cmt" id="cmt-${c.id}">
          <div class="cmt-head"><span>${c.author} · ${fmtStamp(c.ts)}${c.editedAt?' (edited)':''}</span>${unacked?`<span class="badge b-idle" style="font-size:9.5px;padding:2px 7px">Not yet seen by ${t.owner}</span>`:''}</div>
          <div class="cmt-body">${c.text.replace(/</g,'&lt;')}</div>
          <div style="display:flex;gap:14px;margin-top:2px">
            ${canEditComment(c)?`<div class="cmt-edit" onclick="startEditComment('${t.id}','${c.id}','${backOid||''}')">Edit</div>`:''}
            ${unacked&&(ME.name===t.owner||ME.boss)?`<div class="cmt-edit" onclick="acknowledgeComment('${t.id}','${c.id}');reopenModal('${t.id}','${backOid||''}')">Acknowledge</div>`:''}
          </div>
        </div>`;}).join(''):`<p class="waiting" style="margin:0 0 8px">No comments yet.</p>`}
      <textarea class="note" id="newComment" placeholder="Add an update…" rows="2"></textarea>
      <button class="btn" style="width:100%;margin-top:8px" onclick="submitComment('${t.id}','${backOid||''}')">Add comment</button>
    </div>`;

  const body=`<div class="grab"></div>
    <h3>${t.name}</h3><p class="mh-sub"><span class="chip order">${o.code}</span> &nbsp;${o.style.split('·')[0].trim()}</p>
    <div class="field"><span class="badge ${m.c}" style="margin-bottom:6px;display:inline-block">${m.l}</span>
      <p class="mh-sub" style="margin:6px 0 0">${statusLine}</p></div>
    ${actions}
    ${!canAct?`<p class="waiting">Only ${t.owner} or the admin can update this task.</p>`:''}
    ${attrsBlock}
    ${remindersBlock}
    ${commentsBlock}
    <div class="row-btns" style="margin-top:6px">
      <button class="btn" onclick="${back}">Close</button>
      ${boss?`<button class="btn danger" onclick="removeTask('${t.id}','${backOid||''}')">Remove task</button>`:''}
    </div>`;
  showSheet(body);
}
function reopenModal(id,backOid){ openTask(id,backOid); rerender(); }
function startTask(id,backOid){
  const t=DB.tasks.find(x=>x.id===id);
  if(!unlockInfo(t).unlocked){alert('This task is still Upcoming — a previous task needs to finish or start first.');return;}
  t.status='in_progress'; t.actualStart=fmtISO(today());
  save(); reopenModal(id,backOid);
  sbUpdate('tasks',id,{status:t.status,actual_start:t.actualStart});
}
function finishTask(id,backOid){
  const t=DB.tasks.find(x=>x.id===id);
  t.status='completed'; t.actualEnd=fmtISO(today());
  autoResolveReminders(t);
  save(); reopenModal(id,backOid);
  sbUpdate('tasks',id,{status:t.status,actual_end:t.actualEnd});
  syncReminders(t);
}
function reopenTask(id,backOid){
  if(!confirm('Reopen this task? This clears its start/finish record.'))return;
  const t=DB.tasks.find(x=>x.id===id);
  t.status='pending'; t.actualStart=null; t.actualEnd=null;
  save(); reopenModal(id,backOid);
  sbUpdate('tasks',id,{status:t.status,actual_start:null,actual_end:null});
}
function forceCompleteTask(id,backOid){
  if(!ME.boss)return;
  const t=DB.tasks.find(x=>x.id===id);
  if(!confirm(`Mark "${t.name}" as done? This skips the normal Start → Finish steps — use it for backlog entry or writing off a task regardless of where it currently stands.`))return;
  if(!t.actualStart)t.actualStart=fmtISO(today());
  t.status='completed'; t.actualEnd=fmtISO(today());
  autoResolveReminders(t);
  save(); reopenModal(id,backOid);
  sbUpdate('tasks',id,{status:t.status,actual_start:t.actualStart,actual_end:t.actualEnd});
  syncReminders(t);
}

// pushes the recomputed plannedStart for every task in an order — recomputePlanned can
// cascade across many tasks at once, so this syncs the whole affected set in one batch
function syncPlannedStarts(oid){
  DB.tasks.filter(t=>t.oid===oid).forEach(t=>{ sbUpdate('tasks',t.id,{planned_start:t.plannedStart}); });
}
function syncReminders(t){
  t.reminders.forEach(r=>{ sbUpdate('task_reminders',r.id,{status:r.status,resolved_at:r.resolvedAt,resolved_by:r.resolvedBy,resolved_via:r.resolvedVia,reply_comment_id:r.replyCommentId}); });
}
function doRemoveTask(id){
  const t=DB.tasks.find(x=>x.id===id); if(!t)return;
  const oid=t.oid;
  const preds=inEdges(id), succs=outEdges(id);
  const newEdges=[];
  preds.forEach(pe=>succs.forEach(se=>{
    if(!DB.edges.some(e=>e.oid===oid&&e.from===pe.from&&e.to===se.to)){ const ne={id:crypto.randomUUID(),oid,from:pe.from,to:se.to,type:pe.type}; DB.edges.push(ne); newEdges.push(ne); }
  }));
  const removedEdgeIds=DB.edges.filter(e=>e.from===id||e.to===id).map(e=>e.id);
  DB.edges=DB.edges.filter(e=>e.from!==id&&e.to!==id);
  DB.tasks=DB.tasks.filter(x=>x.id!==id);
  recomputePlanned(oid,true);
  save();
  sbDelete('tasks',id);
  removedEdgeIds.forEach(eid=>{ if(!newEdges.some(ne=>ne.id===eid)) sbDelete('task_edges',eid); });
  newEdges.forEach(ne=>{ sbInsert('task_edges',{id:ne.id,order_id:oid,from_task:ne.from,to_task:ne.to,edge_type:ne.type}); });
  syncPlannedStarts(oid);
}
function removeTask(id,backOid){

  const warn=t.status!=='pending'?' This task already has progress logged (start/finish dates, comments) — removing it deletes that history too.':'';
  if(!confirm('Remove this task? Tasks depending on it will be connected to its predecessors instead.'+warn))return;
