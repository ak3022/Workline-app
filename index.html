}
function openFlowchart(mode,key){
  const g=graphFor(mode,key);
  const ids=g.tasks.map(t=>t.id);
  const ranks=computeRanks(ids,g.edges);
  const seq=seqNumbers(ids,g.edges);
  const canEdit = mode==='template' || ME.boss;
  const svg=buildFlowchartSVG(g.tasks,g.edges,ranks,seq,mode,key,canEdit);
  const back = mode==='template' ? `openTemplateList()` : `openJob('${key}')`;
  const hint = mode==='template'
    ? 'Tap a task to edit it, drag it to rearrange, or drag the blue dot to connect it to another step. Tap a connection to change or remove it.'
    : (canEdit ? "Tap a task to edit it, drag it to rearrange, or drag the blue dot to rewire it. Tap a connection or the × to change it." : "This job's own process — tap a task you own to update it.");
  showSheet(`<div class="grab"></div><h3>${g.label} — process map</h3>
    <p class="mh-sub">${hint}</p>
    <div class="fc-wrap">${svg}</div>
    <div class="fc-legend">
      <span class="ln"><span class="sw" style="border-color:var(--fs)"></span>After it finishes</span>
      <span class="ln"><span class="sw dash" style="border-color:var(--ss)"></span>Once it starts</span>
    </div>
    ${canEdit?`<button class="btn primary" style="width:100%;margin-top:14px" onclick="openNodeEditor('${mode}','${key}',null)">+ Add task</button>`:''}
    <button class="btn" style="width:100%;margin-top:8px" onclick="${back}">Close</button>`);
  wireFlowchartDrag(mode,key);
}
// Greedy word-wrap so a long task name shows in full across a couple of lines rather
// than getting truncated — never breaks a word mid-way.
function wrapLabel(text,maxChars){
  const words=text.split(' ');
  const lines=[]; let cur='';
  words.forEach(w=>{
    const trial=cur?cur+' '+w:w;
    if(trial.length<=maxChars||!cur) cur=trial;
    else{ lines.push(cur); cur=w; }
  });
  if(cur)lines.push(cur);
  return lines;
}
// A 1-line node keeps the original 64px height; each extra wrapped line grows the box
// so text is never cramped or clipped.
function labelHeight(lineCount){ return 64+Math.max(0,lineCount-1)*16; }
function layoutGraph(tasks,ranks,seq){
  const rows={};
  tasks.forEach(t=>{ const r=ranks.get(t.id)||0; (rows[r]=rows[r]||[]).push(t); });
  const rowH=140, nodeW=152, gapX=22, padTop=26, padX=20;
  const maxCols=Math.max(1,...Object.values(rows).map(r=>r.length));
  let canvasW=Math.max(320, maxCols*nodeW+(maxCols-1)*gapX+padX*2);
  const pos={}, labelLines={};
  Object.keys(rows).sort((a,b)=>a-b).forEach(rk=>{
    const rowTasks=rows[rk];
    const rowW=rowTasks.length*nodeW+(rowTasks.length-1)*gapX;
    const startX=(canvasW-rowW)/2;
    rowTasks.forEach((t,i)=>{
      const lines=wrapLabel(`${seq.get(t.id)}. ${t.name}`,20);
      labelLines[t.id]=lines;
      // rows stay evenly spaced using the base 64px reference regardless of how tall
      // any individual (wrapped) node ends up — a taller node just grows around its
      // own row's center, and the generous row gap absorbs it without colliding.
      pos[t.id]={x:startX+i*(nodeW+gapX)+nodeW/2, y:padTop+(+rk)*rowH+32, h:labelHeight(lines.length)};
    });
  });
  const maxRank=Math.max(0,...[...ranks.values()]);
  let canvasH=padTop+(maxRank+1)*rowH+20;
  // a manually dragged position wins over the auto layout for that node
  tasks.forEach(t=>{ if(typeof t.x==='number'&&typeof t.y==='number') pos[t.id]={...pos[t.id],x:t.x,y:t.y}; });
  // widen/heighten the canvas so a dragged or tall-wrapped node is never clipped
  Object.values(pos).forEach(p=>{
    canvasW=Math.max(canvasW, p.x+nodeW/2+padX);
    canvasH=Math.max(canvasH, p.y+p.h/2+20);
  });
  return {pos,labelLines,nodeW,canvasW,canvasH};
}
// shared elbow-path builder — straight lines, 90° bends only, used by both the static
// render and the live drag updates so they never disagree with each other
function edgePathD(ax,ay,bx,by){
  const midY=Math.round((ay+by)/2);
  return ax===bx ? `M${ax},${ay} L${bx},${by}` : `M${ax},${ay} L${ax},${midY} L${bx},${midY} L${bx},${by}`;
}
function buildFlowchartSVG(tasks,edges,ranks,seq,mode,key,canEdit){
  if(!tasks.length) return `<p class="empty" style="padding:24px 0">No tasks yet.</p>`;
  const {pos,labelLines,nodeW,canvasW,canvasH}=layoutGraph(tasks,ranks,seq);
  let edgesSvg='',nodesSvg='';
  edges.forEach(e=>{
    const a=pos[e.from],b=pos[e.to]; if(!a||!b)return;
    const ax=a.x,ay=a.y+a.h/2,bx=b.x,by=b.y-b.h/2-6;
    const d=edgePathD(ax,ay,bx,by);
    const color=e.type==='SS'?'var(--ss)':'var(--fs)';
    const dash=e.type==='SS'?' stroke-dasharray="5,5"':'';
    const hit = canEdit ? `<path class="fc-edge-hit" d="${d}" fill="none" stroke="transparent" stroke-width="20" pointer-events="stroke" style="cursor:pointer" onclick="openEdgeEditor('${mode}','${key}','${e.from}','${e.to}')"/>` : '';
    edgesSvg+=`<g class="fc-edge-g" data-from="${e.from}" data-to="${e.to}">${hit}
      <path class="fc-edge-line" d="${d}" fill="none" style="stroke:${color}" stroke-width="2"${dash} stroke-linejoin="round" marker-end="url(#arrow-${e.type})" pointer-events="none"/>
    </g>`;
  });
  tasks.forEach(t=>{
    const p=pos[t.id]; if(!p)return;
    const lines=(labelLines[t.id]||[t.name]).map(ln=>ln.replace(/&/g,'&amp;').replace(/</g,'&lt;'));
    const st=mode==='job'?statusOf(t):null;
    const stripeColor=mode==='job'?(SM[st]?SM[st].v:'var(--muted)'):'var(--fs)';
    const locked=mode==='job'&&taskPhase(t)==='locked';
    const sub=mode==='job'?`${initials(t.owner)} · ${t.days}d`:`${t.owner} · ${t.days}d`;
    // read-only viewers get a plain onclick straight to their task sheet. Editors get no
    // onclick at all here — wireFlowchartDrag decides tap-vs-drag itself in pointerup, so a
    // completed drag can't also trigger the browser's synthesized click on the same element.
    const onclickAttr = canEdit ? '' : ` onclick="openTask('${t.id}','${key}')"`;
    const deletable = canEdit && (mode==='template' || t.status==='pending');
    const dx=p.x+nodeW/2-4, dy=p.y-p.h/2+4;
    const delBadge = deletable ? `<g class="fc-del" onclick="event.stopPropagation();deleteNode('${mode}','${key}','${t.id}')" style="cursor:pointer">
        <circle cx="${dx}" cy="${dy}" r="10" style="fill:var(--card);stroke:var(--red)" stroke-width="1.4"/>
        <line x1="${dx-3.5}" y1="${dy-3.5}" x2="${dx+3.5}" y2="${dy+3.5}" style="stroke:var(--red)" stroke-width="1.7" stroke-linecap="round"/>
        <line x1="${dx-3.5}" y1="${dy+3.5}" x2="${dx+3.5}" y2="${dy-3.5}" style="stroke:var(--red)" stroke-width="1.7" stroke-linecap="round"/>
      </g>` : '';
    // outlined ring (card-colored fill, colored stroke) rather than a solid dot — reads
    // as a distinct control point instead of visually fusing with the line it anchors.
    const hcx=p.x, hcy=p.y+p.h/2;
    // small visible ring + a much larger invisible touch target underneath it — 7px was
    // fine for a mouse pointer but far too small to reliably grab with a finger.
    const handle = canEdit ? `<g class="fc-handle" data-id="${t.id}" data-cx="${hcx}" data-cy="${hcy}" style="touch-action:none;cursor:crosshair">
        <circle class="fc-handle-hit" cx="${hcx}" cy="${hcy}" r="16" fill="transparent" pointer-events="all"/>
        <circle class="fc-handle-dot" cx="${hcx}" cy="${hcy}" r="7" style="fill:var(--card);stroke:var(--fs)" stroke-width="2.2" pointer-events="none"/>
      </g>` : '';
    const titleTop=p.y-p.h/2+26;
    const titleText=lines.map((ln,i)=>`<text x="${p.x}" y="${titleTop+i*15}" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--ink)">${ln}</text>`).join('');
    const subY=titleTop+(lines.length-1)*15+20;
    nodesSvg+=`<g opacity="${locked?0.55:1}">
      <g class="fc-node" data-id="${t.id}"${onclickAttr} style="cursor:pointer;touch-action:none">
        <rect x="${p.x-nodeW/2}" y="${p.y-p.h/2}" width="${nodeW}" height="${p.h}" rx="12" style="fill:var(--card);stroke:${stripeColor}" stroke-width="2"/>
        ${titleText}
        <text x="${p.x}" y="${subY}" text-anchor="middle" font-size="10.5" style="fill:var(--ink2)">${sub}</text>
      </g>
      ${handle}
      ${delBadge}
    </g>`;
  });
  return `<svg viewBox="0 0 ${canvasW} ${canvasH}" width="${canvasW}" height="${canvasH}" style="display:block;margin:0 auto" id="fcSvg">
    <defs>
      <marker id="arrow-FS" markerWidth="7" markerHeight="7" refX="6" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" style="fill:var(--fs)"/></marker>
      <marker id="arrow-SS" markerWidth="7" markerHeight="7" refX="6" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" style="fill:var(--ss)"/></marker>
    </defs>
    <g id="fcEdges">${edgesSvg}</g>
    <g id="fcNodes">${nodesSvg}</g>
  </svg>`;
}

/* ---- live pointer-driven drag: reposition nodes, drag-to-connect, tap-to-edit a line ---- */
function wireFlowchartDrag(mode,key){
  const svg=document.getElementById('fcSvg'); if(!svg)return;
  const canEdit = mode==='template' || ME.boss;
  if(!canEdit)return; // read-only viewers get a static diagram, no handles/dragging

  const NODE_W=152;
  let dragNode=null, dragStart=null, dragMoved=false;
  let rafPending=false, pendingMove=null;
  let connectFrom=null, tempLine=null, connectSvgRect=null;
  // The wrapper around the flowchart scrolls normally when idle (needed for large
  // diagrams), but that same touch gesture competes with dragging a node — the
  // likely cause of unreliable drag behavior on phones specifically (works fine
  // with a mouse, which never has this ambiguity). Locking it only while an
  // actual drag is in progress keeps both working correctly.
  const wrap=svg.closest('.fc-wrap');
  const sheetEl=svg.closest('.sheet');
  const lockWrapScroll=()=>{ if(wrap) wrap.style.touchAction='none'; if(sheetEl) sheetEl.style.touchAction='none'; };
  const unlockWrapScroll=()=>{ if(wrap) wrap.style.touchAction=''; if(sheetEl) sheetEl.style.touchAction=''; };

  const svgPoint=(evt,rect)=>({x:evt.clientX-rect.left, y:evt.clientY-rect.top});
  const rectH=g=>parseFloat(g.querySelector('rect').getAttribute('height'));
  const nodeCenter=g=>{ const r=g.querySelector('rect'); return {x:parseFloat(r.getAttribute('x'))+NODE_W/2, y:parseFloat(r.getAttribute('y'))+parseFloat(r.getAttribute('height'))/2}; };

  // grow (never shrink) the visible canvas so a node dragged toward the right/bottom
  // edge is never clipped by a viewBox sized for the pre-drag layout
  function growCanvasTo(needW,needH){
    const parts=(svg.getAttribute('viewBox')||'0 0 0 0').split(' ').map(Number);
    let [minX,minY,vw,vh]=parts;
    let changed=false;
    if(needW>vw){ vw=needW; changed=true; }
    if(needH>vh){ vh=needH; changed=true; }
    if(changed){
      svg.setAttribute('viewBox',`${minX} ${minY} ${vw} ${vh}`);
      svg.setAttribute('width',vw);
      svg.setAttribute('height',vh);
    }
  }

  function applyPendingMove(){
    rafPending=false;
    if(!pendingMove||!dragNode)return;
    const {nx,ny}=pendingMove;
    const h=dragStart.h;
    dragStart.rect.setAttribute('x', nx-NODE_W/2);
    dragStart.rect.setAttribute('y', ny-h/2);
    dragStart.texts.forEach((t,i)=>{ t.setAttribute('x',nx); t.setAttribute('y', ny+dragStart.textOffsets[i]); });
    if(dragStart.handleG){
      dragStart.handleG.setAttribute('data-cx',nx); dragStart.handleG.setAttribute('data-cy',ny+h/2);
      if(dragStart.handleHit){dragStart.handleHit.setAttribute('cx',nx);dragStart.handleHit.setAttribute('cy',ny+h/2);}
      if(dragStart.handleDot){dragStart.handleDot.setAttribute('cx',nx);dragStart.handleDot.setAttribute('cy',ny+h/2);}
    }
    if(dragStart.delCircle){
      const ddx=nx+NODE_W/2-4, ddy=ny-h/2+4;
      dragStart.delCircle.setAttribute('cx',ddx); dragStart.delCircle.setAttribute('cy',ddy);
      const lines=dragStart.delLines;
      if(lines[0]){lines[0].setAttribute('x1',ddx-3.5);lines[0].setAttribute('y1',ddy-3.5);lines[0].setAttribute('x2',ddx+3.5);lines[0].setAttribute('y2',ddy+3.5);}
      if(lines[1]){lines[1].setAttribute('x1',ddx-3.5);lines[1].setAttribute('y1',ddy+3.5);lines[1].setAttribute('x2',ddx+3.5);lines[1].setAttribute('y2',ddy-3.5);}
    }
    dragStart.touchingEdges.forEach(info=>{
      const oc=nodeCenter(info.otherG);
      const ax=info.isFrom?nx:oc.x, ay=info.isFrom?ny+h/2:oc.y-info.otherH/2-6;
      const bx=info.isFrom?oc.x:nx, by=info.isFrom?oc.y-info.otherH/2-6:ny+h/2;
      const d=edgePathD(ax,ay,bx,by);
      info.paths.forEach(p=>p.setAttribute('d',d));
    });
    growCanvasTo(nx+NODE_W/2+30, ny+h/2+30);
  }

  svg.querySelectorAll('.fc-node').forEach(g=>{
    g.addEventListener('pointerdown', e=>{
      if(e.target.closest('.fc-del'))return; // let the delete badge handle its own tap
      e.preventDefault();
      dragNode=g; dragMoved=false;
      const svgRect=svg.getBoundingClientRect();
      const pt=svgPoint(e,svgRect), c=nodeCenter(g);
      const handleG=svg.querySelector(`.fc-handle[data-id="${g.dataset.id}"]`);
      const delG=g.parentElement.querySelector('.fc-del');
      // cache everything this drag will need ONCE — re-querying the DOM on every
      // pointermove was the main cause of jank on slower devices
      const touchingEdges=[...svg.querySelectorAll('#fcEdges .fc-edge-g')]
        .filter(gr=>gr.dataset.from===g.dataset.id||gr.dataset.to===g.dataset.id)
        .map(grp=>{
          const isFrom=grp.dataset.from===g.dataset.id;
          const otherId=isFrom?grp.dataset.to:grp.dataset.from;
          const otherG=svg.querySelector(`.fc-node[data-id="${otherId}"]`);
          return otherG?{isFrom,otherG,otherH:rectH(otherG),paths:[...grp.querySelectorAll('path')]}:null;
        }).filter(Boolean);
      dragStart={
        svgRect, x:pt.x, y:pt.y, cx:c.x, cy:c.y, h:rectH(g),
        rect:g.querySelector('rect'),
        texts:[...g.querySelectorAll('text')],
        textOffsets:[...g.querySelectorAll('text')].map(t=>parseFloat(t.getAttribute('y'))-c.y),
        touchingEdges,
        handleG, handleHit:handleG?handleG.querySelector('.fc-handle-hit'):null, handleDot:handleG?handleG.querySelector('.fc-handle-dot'):null,
        delCircle:delG?delG.querySelector('circle'):null, delLines:delG?delG.querySelectorAll('line'):[],
      };
      try{g.setPointerCapture(e.pointerId);}catch(err){}
      lockWrapScroll();
    });
    g.addEventListener('pointermove', e=>{
      if(dragNode!==g)return;
      e.preventDefault();
      const pt=svgPoint(e,dragStart.svgRect);
      const dx=pt.x-dragStart.x, dy=pt.y-dragStart.y;
      if(!dragMoved && Math.hypot(dx,dy)<6)return;
      dragMoved=true;
      const nx=Math.max(NODE_W/2+8, dragStart.cx+dx);
      const ny=Math.max(dragStart.h/2+8, dragStart.cy+dy);
      pendingMove={nx,ny};
      if(!rafPending){ rafPending=true; requestAnimationFrame(applyPendingMove); }
    });
    g.addEventListener('pointerup', e=>{
      if(dragNode!==g)return;
      const wasMoved=dragMoved;
      dragNode=null;
      unlockWrapScroll();
      if(wasMoved){ const c=nodeCenter(g); setNodePos(mode,key,g.dataset.id,Math.round(c.x),Math.round(c.y)); }
      else{ openNodeEditor(mode,key,g.dataset.id); }
    });
    g.addEventListener('pointercancel', ()=>{ dragNode=null; unlockWrapScroll(); });
  });

  svg.querySelectorAll('.fc-handle').forEach(hg=>{
    hg.addEventListener('pointerdown', e=>{
      e.stopPropagation(); e.preventDefault();
      connectFrom=hg.dataset.id;
      connectSvgRect=svg.getBoundingClientRect();
      const pt=svgPoint(e,connectSvgRect);
      tempLine=document.createElementNS('http://www.w3.org/2000/svg','line');
      tempLine.setAttribute('x1',hg.dataset.cx); tempLine.setAttribute('y1',hg.dataset.cy);
      tempLine.setAttribute('x2',pt.x); tempLine.setAttribute('y2',pt.y);
      tempLine.setAttribute('style','stroke:var(--blue);stroke-width:2.5px;stroke-dasharray:4,4');
      svg.appendChild(tempLine);
      try{hg.setPointerCapture(e.pointerId);}catch(err){}
      lockWrapScroll();
    });
    hg.addEventListener('pointermove', e=>{
      if(!tempLine||connectFrom!==hg.dataset.id)return;
      e.preventDefault();
      const pt=svgPoint(e,connectSvgRect);
      tempLine.setAttribute('x2',pt.x); tempLine.setAttribute('y2',pt.y);
      growCanvasTo(pt.x+40, pt.y+40); // dragging a connection past the edge grows the canvas too
    });
    hg.addEventListener('pointerup', e=>{
      if(connectFrom!==hg.dataset.id)return;
      if(tempLine){svg.removeChild(tempLine);tempLine=null;}
      unlockWrapScroll();
      // a finger covers more area than a cursor, so the exact drop point can miss the
      // target node by a few pixels — fall back to the nearest node center within a
      // generous radius rather than requiring a pixel-perfect drop
      let toId=null;
      const target=document.elementFromPoint(e.clientX,e.clientY);
      const targetNode=target&&target.closest?target.closest('.fc-node'):null;
      if(targetNode) toId=targetNode.dataset.id;
      else{
        const pt=svgPoint(e,connectSvgRect);
        let best=null,bestDist=40; // px, generous enough for a finger, tight enough to avoid wrong picks
        svg.querySelectorAll('.fc-node').forEach(ng=>{
          if(ng.dataset.id===connectFrom)return;
          const c=nodeCenter(ng);
          const d=Math.hypot(c.x-pt.x,c.y-pt.y);
          if(d<bestDist){bestDist=d;best=ng.dataset.id;}
        });
        toId=best;
      }
      const fromId=connectFrom; connectFrom=null;
      if(toId&&toId!==fromId) createEdgeFromDrag(mode,key,fromId,toId);
    });
    hg.addEventListener('pointercancel', ()=>{ if(tempLine){svg.removeChild(tempLine);tempLine=null;} connectFrom=null; unlockWrapScroll(); });
  });
}
function setNodePos(mode,key,taskId,x,y){
  const t = mode==='template' ? DB.templates[key].tasks.find(x2=>x2.id===taskId) : DB.tasks.find(x2=>x2.id===taskId&&x2.jid===key);
  if(!t)return;
  t.x=x; t.y=y;
  save();
  if(mode==='template') sbUpdate('chain_tasks',taskId,{pos_x:x,pos_y:y});
  else sbUpdate('tasks',taskId,{pos_x:x,pos_y:y});
}
function createEdgeFromDrag(mode,key,fromId,toId){
  const g=graphFor(mode,key);
  if(g.edges.some(e=>e.from===fromId&&e.to===toId))return; // already connected
  if(wouldCreateCycle(g.edges,fromId,toId)){ alert('That connection would create a loop.'); return; }
  if(mode==='job'){
    const t=DB.tasks.find(x=>x.id===toId);
    if(!canEditIncoming(t)){ alert('"'+t.name+'" has already started, so its dependencies are locked.'); return; }
  }
  if(mode==='template'){
    DB.templates[key].edges.push({from:fromId,to:toId,type:'FS'});
    sbInsert('chain_edges',{chain_id:key,from_task:fromId,to_task:toId,edge_type:'FS'});
  }else{
    const e={id:crypto.randomUUID(),jid:key,from:fromId,to:toId,type:'FS'};
    DB.edges.push(e);
    recomputePlanned(key,true);
    sbInsert('task_edges',{id:e.id,job_id:key,from_task:fromId,to_task:toId,edge_type:'FS'});
    syncPlannedStarts(key);
  }
  save();
  openFlowchart(mode,key);
}
function openEdgeEditor(mode,key,fromId,toId){
  const g=graphFor(mode,key);
  const fromT=g.tasks.find(t=>t.id===fromId), toT=g.tasks.find(t=>t.id===toId);
  const edge=g.edges.find(e=>e.from===fromId&&e.to===toId);
  if(!edge||!fromT||!toT){ openFlowchart(mode,key); return; }
  const locked = mode==='job' && !canEditIncoming(DB.tasks.find(x=>x.id===toId));
  const back=`openFlowchart('${mode}','${key}')`;
  showSheet(`<div class="grab"></div><h3>Connection</h3>
    <p class="mh-sub"><b>${fromT.name}</b> → <b>${toT.name}</b></p>
    ${locked?`<p class="waiting">Locked — "${toT.name}" has already started.</p>`:`
    <div class="dep-type" style="width:100%;margin-bottom:16px">
      <button type="button" style="flex:1" class="${edge.type==='FS'?'on fs':''}" onclick="setEdgeType('${mode}','${key}','${fromId}','${toId}','FS')">After finish</button>
      <button type="button" style="flex:1" class="${edge.type==='SS'?'on ss':''}" onclick="setEdgeType('${mode}','${key}','${fromId}','${toId}','SS')">On start</button>
    </div>
    <button class="btn danger" style="width:100%;margin-bottom:10px" onclick="removeEdgeBetween('${mode}','${key}','${fromId}','${toId}')">Remove this connection</button>`}
    <button class="btn" style="width:100%" onclick="${back}">Done</button>`);
}
function setEdgeType(mode,key,fromId,toId,type){
  const edges = mode==='template' ? DB.templates[key].edges : DB.edges.filter(e=>e.jid===key);
  const e=edges.find(x=>x.from===fromId&&x.to===toId);
  if(e){
    e.type=type; save();
    if(mode==='template') sb.from('chain_edges').update({edge_type:type}).eq('chain_id',key).eq('from_task',fromId).eq('to_task',toId);
    else sbUpdate('task_edges',e.id,{edge_type:type});
  }
  openEdgeEditor(mode,key,fromId,toId);
}
function removeEdgeBetween(mode,key,fromId,toId){
  if(mode==='template'){
    DB.templates[key].edges = DB.templates[key].edges.filter(e=>!(e.from===fromId&&e.to===toId));
    sb.from('chain_edges').delete().eq('chain_id',key).eq('from_task',fromId).eq('to_task',toId);
  }else{
    const e=DB.edges.find(x=>x.jid===key&&x.from===fromId&&x.to===toId);
    DB.edges = DB.edges.filter(e2=>!(e2.jid===key&&e2.from===fromId&&e2.to===toId));
    recomputePlanned(key,true);
    if(e)sbDelete('task_edges',e.id);
    syncPlannedStarts(key);
  }
  save();
  openFlowchart(mode,key);
}

/* ---- add / edit a node in a template OR a live job graph ---- */
function openNodeEditor(mode,key,taskId){
  const isTpl=mode==='template';
  const g=graphFor(mode,key);
  const t=taskId?g.tasks.find(x=>x.id===taskId):null;
  const isEdit=!!t;
  const others=g.tasks.filter(x=>x.id!==taskId);
  const curMap=new Map(g.edges.filter(e=>e.to===taskId).map(e=>[e.from,e.type]));
  const backFn=isTpl?`openFlowchart('template','${key}')`:`openFlowchart('job','${key}')`;
  const graphMinusOwn=g.edges.filter(e=>e.to!==taskId);
  const depRows=others.map(p=>{
    const checked=curMap.has(p.id);
    const cyc=!checked&&wouldCreateCycle(graphMinusOwn,p.id,taskId||'__new__');
    const type=curMap.get(p.id)||'FS';
    return `<div class="dep-row">
      <input type="checkbox" id="ndep-${p.id}" ${checked?'checked':''} ${cyc?'disabled':''}>
      <span class="dep-name">${p.name}${cyc?' <span class="waiting">(loop)</span>':''}</span>
      <span class="dep-type" id="ndtype-${p.id}" data-type="${type}">
        <button type="button" class="${type==='FS'?'on fs':''}" onclick="setNDepType('${p.id}','FS')">After finish</button>
        <button type="button" class="${type==='SS'?'on ss':''}" onclick="setNDepType('${p.id}','SS')">On start</button>
      </span></div>`;
  }).join('');
  const ownerOpts=PEOPLE.map(p=>`<option value="${p.name}" ${t&&p.name===t.owner?'selected':''}>${p.name}</option>`).join('');
  const canEditThisIncoming = isTpl || !isEdit || canEditIncoming(DB.tasks.find(x=>x.id===taskId));
  const canEditThisAttrs = isTpl || !isEdit || canEditAttrs(DB.tasks.find(x=>x.id===taskId));
  const statusBlock = (!isTpl && isEdit) ? (()=>{ const s=statusOf(t),m=SM[s];
    return `<div class="field"><span class="badge ${m.c}" style="display:inline-block">${m.l}</span>
      <button class="btn" style="width:100%;margin-top:10px" onclick="openTask('${taskId}','${key}')">Manage status &amp; comments ›</button></div>`; })() : '';
  showSheet(`<div class="grab"></div><h3>${isEdit?'Edit task':'Add task'}</h3>
    <p class="mh-sub">${isTpl?'Part of the standard '+g.label+' process.':'Adds one step to this job only.'}</p>
    ${statusBlock}
    <div class="field"><label>Task name</label><input id="nd-name" value="${isEdit?t.name.replace(/"/g,'&quot;'):''}" placeholder="" ${canEditThisAttrs?'':'disabled'}></div>
    <div class="two">
      <div class="field"><label>Owner</label><select id="nd-owner" ${canEditThisAttrs?'':'disabled'}>${ownerOpts}</select></div>
      <div class="field"><label>Days allowed</label><input id="nd-days" type="number" min="1" value="${isEdit?t.days:1}" ${canEditThisAttrs?'':'disabled'}></div>
    </div>
    <div class="field"><label>Starts after</label>
      ${others.length?depRows:`<p class="waiting">No other tasks yet — this will be a starting task.</p>`}
      ${!canEditThisIncoming?`<p class="waiting">Locked — this task has already started.</p>`:''}
    </div>
    <div class="row-btns" style="margin-top:6px"><button class="btn" onclick="${backFn}">Cancel</button>
      <button class="btn primary" onclick="saveNode('${mode}','${key}',${isEdit?`'${taskId}'`:'null'})">${isEdit?'Save':'Add task'}</button></div>
    ${isEdit?`<button class="btn danger" style="width:100%;margin-top:10px" onclick="deleteNode('${mode}','${key}','${taskId}')">Remove task</button>`:''}`);
}
function setNDepType(pid,type){
  const wrap=document.getElementById('ndtype-'+pid); wrap.dataset.type=type;
  const btns=wrap.querySelectorAll('button'); btns[0].className=type==='FS'?'on fs':''; btns[1].className=type==='SS'?'on ss':'';
  const cb=document.getElementById('ndep-'+pid); if(cb)cb.checked=true;
}
async function saveNode(mode,key,taskId){
  const isTpl=mode==='template';
  const name=document.getElementById('nd-name').value.trim();
  if(!name){alert('Enter a task name.');return;}
  const owner=document.getElementById('nd-owner').value;
  const days=Math.max(1,parseInt(document.getElementById('nd-days').value,10)||1);
  const g=graphFor(mode,key);
  const others=g.tasks.filter(x=>x.id!==taskId);
  const newPreds=[];
  others.forEach(p=>{
    const cb=document.getElementById('ndep-'+p.id);
    if(cb&&cb.checked){ const wrap=document.getElementById('ndtype-'+p.id); newPreds.push({from:p.id,type:wrap.dataset.type||'FS'}); }
  });

  if(isTpl){
    const tpl=DB.templates[key];
    let id=taskId;
    if(!id){
      const row=await sbInsert('chain_tasks',{chain_id:key,name,owner_name:owner,days});
      id=row?row.id:(key+'_'+(DB.seq++));
      tpl.tasks.push({id,name,owner,days});
    }else{
      const tt=tpl.tasks.find(x=>x.id===id); tt.name=name;tt.owner=owner;tt.days=days;
      sbUpdate('chain_tasks',id,{name,owner_name:owner,days});
    }
    tpl.edges=tpl.edges.filter(e=>e.to!==id);
    await sb.from('chain_edges').delete().eq('chain_id',key).eq('to_task',id);
    for(const np of newPreds){
      tpl.edges.push({from:np.from,to:id,type:np.type});
      sbInsert('chain_edges',{chain_id:key,from_task:np.from,to_task:id,edge_type:np.type});
    }
    save(); openFlowchart('template',key);
  }else{
    const jid=key;
    let id=taskId;
    if(!id){
      const row=await sbInsert('tasks',{job_id:jid,name,owner_name:owner,days,status:'pending'});
      id=row?row.id:('T'+(DB.seq++));
      DB.tasks.push({id,jid,name,owner,days,status:'pending',actualStart:null,actualEnd:null,plannedStart:null,comments:[],reminders:[]});
    }else{
      const tt=DB.tasks.find(x=>x.id===id); if(canEditAttrs(tt)){tt.name=name;tt.owner=owner;tt.days=days; sbUpdate('tasks',id,{name,owner_name:owner,days});}
    }
    const tt2=DB.tasks.find(x=>x.id===id);
    if(!taskId||canEditIncoming(tt2)){
      DB.edges=DB.edges.filter(e=>!(e.jid===jid&&e.to===id));
      await sb.from('task_edges').delete().eq('job_id',jid).eq('to_task',id);
      for(const np of newPreds){
        DB.edges.push({id:crypto.randomUUID(),jid,from:np.from,to:id,type:np.type});
        sbInsert('task_edges',{job_id:jid,from_task:np.from,to_task:id,edge_type:np.type});
      }
    }
    recomputePlanned(jid,true);
    save(); openFlowchart('job',jid);
    syncPlannedStarts(jid);
  }
}
function deleteNode(mode,key,taskId){
  if(!confirm('Remove this task?'))return;
  if(mode==='template'){
    const tpl=DB.templates[key];
    if(tpl.tasks.length<=1){alert('Keep at least one task in the template.');return;}
    const preds=tpl.edges.filter(e=>e.to===taskId), succs=tpl.edges.filter(e=>e.from===taskId);
    const newEdges=[];
    preds.forEach(pe=>succs.forEach(se=>{ if(!tpl.edges.some(e=>e.from===pe.from&&e.to===se.to)){ const ne={from:pe.from,to:se.to,type:pe.type}; tpl.edges.push(ne); newEdges.push(ne); } }));
    tpl.edges=tpl.edges.filter(e=>e.from!==taskId&&e.to!==taskId);
    tpl.tasks=tpl.tasks.filter(x=>x.id!==taskId);
    save(); openFlowchart('template',key);
    sbDelete('chain_tasks',taskId); // cascades chain_edges referencing it, per the schema
    newEdges.forEach(ne=>{ sbInsert('chain_edges',{chain_id:key,from_task:ne.from,to_task:ne.to,edge_type:ne.type}); });
  }else{
    const t=DB.tasks.find(x=>x.id===taskId);
    if(t.status!=='pending'){alert('Only tasks that have not started can be removed.');return;}
    doRemoveTask(taskId);
    openFlowchart('job',key);
  }
}

// copies a chain's tasks and their dependencies under a new name \u2014 same id-remap approach
// makeJob() uses when instantiating a template into a real job (new ids client-side,
// inserted with those explicit ids so there's no id-swap window afterward)
async function duplicateProcessChain(id,newLabel){
  const src=DB.templates[id];
  const newId=crypto.randomUUID();
  const idMap={};
  const newTasks=src.tasks.map(t=>{ const nid=crypto.randomUUID(); idMap[t.id]=nid; return {id:nid,name:t.name,owner:t.owner,days:t.days}; });
  const newEdges=src.edges.map(e=>({from:idMap[e.from],to:idMap[e.to],type:e.type}));
  DB.templates[newId]={label:newLabel,blurb:src.blurb||'',tasks:newTasks,edges:newEdges};
  save(); openTemplateList();
  await sbInsert('process_chains',{id:newId,label:newLabel,blurb:src.blurb||''});
  await Promise.all(newTasks.map(t=>sbInsert('chain_tasks',{id:t.id,chain_id:newId,name:t.name,owner_name:t.owner,days:t.days})));
  await Promise.all(newEdges.map(e=>sbInsert('chain_edges',{chain_id:newId,from_task:e.from,to_task:e.to,edge_type:e.type})));
}

/* ================= PLANNED VS ACTUAL CHART ================= */
let CHART_INFO={};
function openChart(jid){
  const o=jobOf(jid);
  const ids=DB.tasks.filter(t=>t.jid===jid).map(t=>t.id);
  const edges=DB.edges.filter(e=>e.jid===jid);
  const seq=seqNumbers(ids,edges);
  const built=buildChartSVG(jid,ids,edges,seq);
  CHART_INFO=built.info;
  showSheet(`<div class="grab"></div><h3>${o.code} — planned vs actual</h3>
    <p class="mh-sub">One row per task in process order, dated along the bottom.</p>
    <div class="fc-wrap">${built.markup}</div>
    <div class="fc-legend">
      <span class="ln"><span class="sw" style="border-color:var(--blue)"></span>Initial plan</span>
      <span class="ln"><span class="sw" style="border-color:var(--orange)"></span>Actual</span>
    </div>
    <div class="chart-tip" id="chartTip">Tap a bar to see which task it is.</div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="closeModal()">Close</button>`);
}
function chartTap(id){
  const info=CHART_INFO[id]; if(!info)return;
  const tip=document.getElementById('chartTip'); if(!tip)return;
  tip.innerHTML=`<b>${info.seq}. ${info.name}</b><br>Planned: ${info.planned}<br>Actual: ${info.actual}`;
}
function buildChartSVG(jid,ids,edges,seq){
  const o=jobOf(jid);
  const start=parseD(o.start);
  const dayOf=iso=>Math.round((parseD(iso)-start)/DAY);
  const tasks=DB.tasks.filter(t=>ids.includes(t.id)).sort((a,b)=>seq.get(a.id)-seq.get(b.id));
  let maxDay=0;
  tasks.forEach(t=>{
    maxDay=Math.max(maxDay,dayOf(plannedEnd(t)));
    if(t.actualStart){ maxDay=Math.max(maxDay,dayOf(t.actualEnd||fmtISO(today()))); }
  });
  maxDay=Math.max(maxDay,5)+3;
  const padL=128,padT=14,padR=16,padB=26,baseRowH=34,lineH=13;
  const chartW=Math.max(320, Math.min(680, maxDay*16+padL));

  // wrap each task's full name (never truncate) and lay out rows with cumulative,
  // variable heights so a 2-line name gets the room it needs
  const labelLines={}, rowCenterY={};
  let cursorY=padT;
  tasks.forEach(t=>{
    const lines=wrapLabel(t.name,19);
    labelLines[t.id]=lines;
    const h=Math.max(baseRowH, 18+lines.length*lineH);
    rowCenterY[t.id]=cursorY+h/2;
    cursorY+=h;
  });
  const chartH=cursorY-padT;
  const xScale=d=>padL+(d/maxDay)*(chartW-padL-padR);
  const yScale=id=>rowCenterY[id];

  let grid='',plannedSvg='',actualSvg='',labels='';
  const niceSteps=[1,2,3,5,7,10,14,21,30,45,60,90,120,180];
  const minLabelGap=64; // px — DD/MM/YYYY is much wider than the old "27 Jul" short form
  const maxLabels=Math.max(3,Math.floor((chartW-padL-padR)/minLabelGap));
  const step=niceSteps.find(s=>maxDay/s<=maxLabels)||niceSteps[niceSteps.length-1];
  for(let d=0;d<=maxDay;d+=step){
    const x=xScale(d);
    const label=fmtNice(fmtISO(addDays(start,d)));
    grid+=`<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+chartH}" style="stroke:var(--hairline)" stroke-width="1"/>
      <text x="${x}" y="${padT+chartH+16}" font-size="9.5" text-anchor="middle" style="fill:var(--muted)">${label}</text>`;
  }
  const byId=new Map(tasks.map(t=>[t.id,t]));
  const info={};
  tasks.forEach(t=>{
    const s=seq.get(t.id), y=yScale(t.id);
    const ps=dayOf(t.plannedStart), pe=dayOf(plannedEnd(t));
    plannedSvg+=`<line x1="${xScale(ps)}" y1="${y}" x2="${xScale(pe)}" y2="${y}" style="stroke:var(--blue);cursor:pointer" stroke-width="5" stroke-linecap="round" onclick="chartTap('${t.id}')"/>`;
    if(t.actualStart){
      const as=dayOf(t.actualStart), ae=dayOf(t.actualEnd||fmtISO(today()));
      plannedSvg+=`<line x1="${xScale(as)}" y1="${y+8}" x2="${xScale(ae)}" y2="${y+8}" style="stroke:var(--orange);cursor:pointer" stroke-width="5" stroke-linecap="round" opacity="${t.actualEnd?1:0.6}" onclick="chartTap('${t.id}')"/>`;
    }
    const lines=labelLines[t.id].map(ln=>ln.replace(/&/g,'&amp;').replace(/</g,'&lt;'));
    const firstLineY=y-(lines.length-1)*lineH/2+3;
    lines.forEach((ln,i)=>{ labels+=`<text x="${padL-8}" y="${firstLineY+i*lineH}" font-size="9.5" text-anchor="end" style="fill:var(--ink2)">${ln}</text>`; });
    info[t.id]={name:t.name,seq:s,
      planned:`${fmtNice(t.plannedStart)} → ${fmtNice(plannedEnd(t))} (${t.days}d)`,
      actual:t.actualStart?`${fmtNice(t.actualStart)} → ${t.actualEnd?fmtNice(t.actualEnd):'ongoing'}`:'not started yet'};
  });
  edges.forEach(e=>{
    const p=byId.get(e.from), c=byId.get(e.to); if(!p||!c)return;
    const ySrc=yScale(p.id), yDst=yScale(c.id);
    const xp=xScale(dayOf(c.plannedStart));
    plannedSvg+=`<line x1="${xp}" y1="${ySrc}" x2="${xp}" y2="${yDst}" style="stroke:var(--blue)" stroke-width="1.5" stroke-dasharray="3,3"/>`;
    if(p.actualStart&&c.actualStart){
      const xa=xScale(dayOf(c.actualStart));
      actualSvg+=`<line x1="${xa}" y1="${ySrc+8}" x2="${xa}" y2="${yDst+8}" style="stroke:var(--orange)" stroke-width="1.5" stroke-dasharray="3,3"/>`;
    }
  });
  const markup=`<svg viewBox="0 0 ${chartW} ${padT+chartH+padB}" width="${chartW}" height="${padT+chartH+padB}" style="display:block">
    ${grid}${plannedSvg}${actualSvg}${labels}
  </svg>`;
  return {markup,info};
}

// Resizes any uploaded image down to a small square before storing it as base64 in
// app_settings — keeps the settings row (fetched on every load) light, and avoids
// needing Supabase Storage just to host one logo per self-hosted instance.
function handleLogoUpload(event){
  const file=event.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const size=512;
      const canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
      const ctx=canvas.getContext('2d');
      const scale=Math.min(size/img.width,size/img.height);
      const w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      const dataUrl=canvas.toDataURL('image/png',0.92);
      sbUpdateSettings({logo_light:dataUrl});
      applyBranding({company_name:BRANDING.companyName,primary_color:BRANDING.primaryColor,logo_light:dataUrl,logo_dark:BRANDING.logoDark});
      toast('Logo updated.');
      renderTeam();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

    const tag=s==='overdue'?`${overdueRunningDays(t)}d late`:s==='idle'?`not started for ${idleDaysOf(t)}d`:`${t.days}d allowed`;
    return `• ${t.name} (${jobOf(t.jid).code}) — ${tag}`;
  }).join('\n');
  const myReminders=allOpenReminders().filter(({t})=>t.owner===name);
  const remindersBlock = myReminders.length ? `\n\nReminders:\n${myReminders.map(({r,t})=>{
    const rs=reminderState(r); const tag=rs==='overdue'?'overdue':rs==='due-today'?'reminder date is today':`reminder date ${fmtNice(r.dueDate)}`;
    return `• ${r.text} — ${t.name} (${jobOf(t.jid).code}), ${tag}`;
  }).join('\n')}` : '';
  const msg=`${name} currently has ${open.length} open task${open.length!==1?'s':''}${late?`, ${late} running late`:''}${idle?`, ${idle} not started`:''}.\n\n${next||'Nothing else open right now.'}${remindersBlock}`;
  showSheet(`<div class="grab"></div><h3>Status details</h3>
    <p class="mh-sub">What ${name}'s daily notification (if any is due) is based on.</p>
    <div class="wa-phone"><div class="wa-bubble">${msg.replace(/</g,'&lt;')}</div></div>
    <p class="note-sim">The real notification is a short daily summary, sent automatically to their device once they've enabled it — this view just shows the detail behind it.</p>
    <button class="btn" onclick="closeModal()">Close</button>`);
}

function downloadFullBackup(){
  const wb=XLSX.utils.book_new();
  const chainLabel=cid=>(DB.templates[cid]||{}).label||cid||'';
  const jobCode=jid=>{const o=DB.jobs.find(x=>x.id===jid);return o?o.code:jid;};
  const taskName=tid=>{const t=DB.tasks.find(x=>x.id===tid);return t?t.name:tid;};
  const sortedOrders=DB.jobs.slice().sort((a,b)=>a.start.localeCompare(b.start));
  const orderSeq=new Map(sortedOrders.map((o,i)=>[o.id,i]));
  const sortedTasks=DB.tasks.slice().sort((a,b)=>(orderSeq.get(a.jid)-orderSeq.get(b.jid))||a.name.localeCompare(b.name));

  const sheet=(name,header,rows)=>{ const ws=XLSX.utils.aoa_to_sheet([header,...rows]); XLSX.utils.book_append_sheet(wb,ws,name); };

  sheet('Backup info',['Generated at','Generated by','Total jobs','Total tasks','Total people'],
    [[nowStamp(),ME.name,DB.jobs.length,DB.tasks.length,PEOPLE.length]]);

  sheet('People',['Name','Phone','Admin','Tutorial seen','Color'],
    PEOPLE.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>[p.name,p.phone||'',p.boss?'Yes':'No',p.tutorialSeen?'Yes':'No',p.color||'']));

  sheet('Settings',['Notification alert threshold (days)'],[[DB.threshold]]);

  sheet('Jobs',['Code','Client','Process chain','Start date','Ship date',...DB.fieldDefs.map(d=>d.label)],
    sortedOrders.map(o=>[o.code,o.client,chainLabel(o.category),o.start,o.ship||'',...DB.fieldDefs.map(d=>(o.customFields||{})[d.fieldKey]||'')]));

  sheet('Tasks',['Job','Task name','Owner','Days allowed','Status','Actual start','Actual end','Planned start'],
    sortedTasks.map(t=>[jobCode(t.jid),t.name,t.owner,t.days,t.status,t.actualStart||'',t.actualEnd||'',t.plannedStart||'']));

  sheet('Task dependencies',['Job','From task','To task','Type'],
    DB.edges.slice().sort((a,b)=>orderSeq.get(a.jid)-orderSeq.get(b.jid)).map(e=>[jobCode(e.jid),taskName(e.from),taskName(e.to),e.type]));

  sheet('Comments',['Job','Task','Author','Text','Posted','Edited','Acknowledged'],
    sortedTasks.flatMap(t=>t.comments.slice().sort((a,b)=>a.ts.localeCompare(b.ts)).map(c=>[jobCode(t.jid),t.name,c.author,c.text,c.ts,c.editedAt||'',c.acked?'Yes':'No'])));

  sheet('Reminders',['Job','Task','Text','Due date','Created by','Created','Status','Resolved at','Resolved by','Resolved via','Resolved by comment'],
    sortedTasks.flatMap(t=>t.reminders.slice().sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).map(r=>{
      const replyText=r.replyCommentId?(t.comments.find(c=>c.id===r.replyCommentId)||{}).text||'':'';
      return [jobCode(t.jid),t.name,r.text,r.dueDate,r.createdBy,r.createdAt,r.status,r.resolvedAt||'',r.resolvedBy||'',r.resolvedVia||'',replyText];
    })));

  sheet('Job links',['Job','Label','URL','Added by','Added on'],
    sortedOrders.flatMap(o=>o.links.slice().sort((a,b)=>a.ts.localeCompare(b.ts)).map(l=>[o.code,l.label||'',l.url,l.addedBy,l.ts])));

  sheet('Process chains',['Chain','Description'],
    Object.entries(DB.templates).map(([id,tpl])=>[tpl.label,tpl.blurb||'']).sort((a,b)=>a[0].localeCompare(b[0])));

  sheet('Chain tasks',['Chain','Task name','Owner','Days'],
    Object.entries(DB.templates).flatMap(([id,tpl])=>tpl.tasks.map(t=>[tpl.label,t.name,t.owner,t.days])).sort((a,b)=>a[0].localeCompare(b[0])));

  sheet('Chain dependencies',['Chain','From task','To task','Type'],
    Object.entries(DB.templates).flatMap(([id,tpl])=>{
      const nameOf=tid=>{const t=tpl.tasks.find(x=>x.id===tid);return t?t.name:tid;};
      return tpl.edges.map(e=>[tpl.label,nameOf(e.from),nameOf(e.to),e.type]);
    }).sort((a,b)=>a[0].localeCompare(b[0])));

  sheet('Job fields',['Field name','Type','Required','Options'],
    DB.fieldDefs.map(d=>[d.label,FIELD_TYPES.find(t=>t.v===d.type).l,d.required?'Yes':'No',(DB.fieldOptions[d.fieldKey]||[]).join(', ')]));

  const stamp=fmtISO(today());
  XLSX.writeFile(wb,`Full-Backup-${stamp}.xlsx`);
  toast('Backup downloaded — save it somewhere safe (Drive, email, etc.)');
}

async function adminResetPassword(personId,personName){
  const p=PEOPLE.find(x=>x.id===personId);
  if(!p||!p.authUserId){alert(`${personName} hasn't created an account yet — there's nothing to reset. They set their own password the first time they sign in.`);return;}
  const pw=prompt(`Set a new password for ${personName} (6+ characters). Tell them directly — this doesn't notify them automatically.`);
  if(pw===null)return;
  if(pw.length<6){alert('Password must be at least 6 characters.');return;}
  const {data:{session}}=await sb.auth.getSession();
  try{
    const resp=await fetch(`${SUPABASE_URL}/functions/v1/admin-reset-password`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
      body:JSON.stringify({targetPersonId:personId,newPassword:pw})
    });
    const result=await resp.json();
    if(result.error) alert('Could not reset password: '+result.error);
    else toast(`Password reset for ${personName}.`);
  }catch(e){
    alert('Could not reach the password-reset function — make sure it has been deployed in Supabase (Edge Functions).');
  }
}
async function savePerson(oldName){
  const name=document.getElementById('pe-name').value.trim();
  const phone=document.getElementById('pe-phone').value.trim();
  const boss=document.getElementById('pe-boss').checked;
  if(!name){alert('Please enter a name.');return;}
  const clash=PEOPLE.find(p=>p.name.toLowerCase()===name.toLowerCase()&&p.name!==oldName);
  if(clash){alert('Another person already has that name.');return;}
  if(oldName){
    const p=PEOPLE.find(x=>x.name===oldName);
    if(name!==oldName){
      DB.tasks.forEach(t=>{if(t.owner===oldName)t.owner=name;});
      Object.values(DB.templates).forEach(tpl=>tpl.tasks.forEach(t=>{if(t.owner===oldName)t.owner=name;}));
      if(ME&&ME.name===oldName)ME.name=name;
    }
    p.name=name;p.phone=phone;p.boss=boss;
    sbUpdate('people',p.id,{name,phone:phone||null,is_admin:boss});
    save();closeModal();
    renderTeam();renderLoginOptions();
  }else{
    closeModal();
    const row=await sbInsert('people',{name,phone:phone||null,is_admin:boss,color:nextColor(),tutorial_seen:false});
    if(!row){alert('Could not add person — check your connection and try again.');return;}
    PEOPLE.push({id:row.id,name,phone,boss,color:row.color,tutorialSeen:false,authUserId:null});
    save();renderTeam();renderLoginOptions();
  }
  if(ME){const a=document.getElementById('hdrAvatar');a.style.background=personColor(ME.name);a.textContent=initials(ME.name);
    document.getElementById('navTeam').style.display=ME.boss?'flex':'none';}
}

  if(ME&&ME.name===name){alert('You cannot remove the person who is currently signed in.');return;}
  const n=DB.tasks.filter(t=>t.owner===name).length;

function doRemove(name){
  const p=PEOPLE.find(x=>x.name===name);
  const to=(document.getElementById('rm-to')||{}).value||fallbackOwner();
  DB.tasks.forEach(t=>{if(t.owner===name)t.owner=to;});
  Object.values(DB.templates).forEach(tpl=>tpl.tasks.forEach(t=>{if(t.owner===name)t.owner=to;}));
  const i=PEOPLE.findIndex(x=>x.name===name);if(i>=0)PEOPLE.splice(i,1);
  save();closeModal();renderTeam();renderLoginOptions();
  sb.from('tasks').update({owner_name:to}).eq('owner_name',name);
  sb.from('chain_tasks').update({owner_name:to}).eq('owner_name',name);
  if(p)sbDelete('people',p.id);
}

// Phone back button/gesture fires 'popstate' rather than closing the app outright.
// If something's open, close it instead of exiting — only once nothing is left
// open does a further back press fall through to actually leaving the app,
// which is the correct, expected behavior at that point.
window.addEventListener('popstate',function(){
  if(document.getElementById('modalRoot').innerHTML.trim()!==''){
    document.getElementById('modalRoot').innerHTML='';

  const b=document.getElementById('themeBtn');if(b)b.innerHTML=dark?SUN:MOON;
  const bl=document.getElementById('themeBtnLogin');if(bl)bl.innerHTML=dark?SUN:MOON;
  updateLoginLogo();}
function toggleTheme(){const t=document.body.classList.contains('dark')?'light':'dark';
  try{localStorage.setItem(TKEY,t);}catch(e){} applyTheme(t);}
(function(){let t='light';try{t=localStorage.getItem(TKEY)||'light';}catch(e){} applyTheme(t);})();

/* ================= SUPABASE BACKEND =================
   Fill these in with YOUR OWN Supabase project's values before deploying —
   Project Settings → API (URL + anon/publishable key), and Project Settings
   → Edge Functions or a `web-push generate-vapid-keys` run for the VAPID
   public key (its matching private key is an Edge Function secret, never
   placed here). See README.md for the full setup walkthrough. */
const SUPABASE_URL='YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false }
});
const PUBLIC_VAPID_KEY='YOUR_VAPID_PUBLIC_KEY';
function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
// Registers the service worker and subscribes this device to push notifications, saving
// the subscription to Supabase so the scheduled reminder function knows where to send to.
// Safe to call repeatedly — a no-op once already granted/subscribed, and silently does
// nothing on browsers/contexts that don't support push (e.g. iOS before being added to
// the home screen) rather than erroring.
async function setupPushNotifications(){
  if(!ME||!('serviceWorker' in navigator)||!('PushManager' in window))return;
  try{
    const reg=await navigator.serviceWorker.register('/sw.js');
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(PUBLIC_VAPID_KEY)});
    }
    const j=sub.toJSON();
    await sb.from('push_subscriptions').upsert(
      {person_id:ME.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},
      {onConflict:'endpoint'}
    );
  }catch(e){ console.error('push notification setup failed',e); }
}
function syntheticEmail(personId){ return `p-${personId}@workline.internal`; }

async function sbInsert(table,row){ const {data,error}=await sb.from(table).insert(row).select().single(); if(error){console.error('insert',table,error);} return data; }
async function sbUpdate(table,id,patch){ const {error}=await sb.from(table).update(patch).eq('id',id); if(error)console.error('update',table,error); }
async function sbDelete(table,id){ const {error}=await sb.from(table).delete().eq('id',id); if(error)console.error('delete',table,error); }

// ---- fetch everything and rebuild the local DB shape the rest of the app already expects ----
async function loadFromSupabase(){
  const [people,chains,chainTasks,chainEdges,fieldDefs,fieldOptions,jobsRes,jobLinks,jobComments,tasks,taskEdges,comments,reminders,settings] = await Promise.all([
    sb.from('people').select('*'), sb.from('process_chains').select('*'), sb.from('chain_tasks').select('*'),
    sb.from('chain_edges').select('*'), sb.from('job_field_defs').select('*').order('sort_order'), sb.from('field_options').select('*').order('sort_order'),
    sb.from('jobs').select('*'), sb.from('job_links').select('*'), sb.from('job_comments').select('*'), sb.from('tasks').select('*'), sb.from('task_edges').select('*'),
    sb.from('task_comments').select('*'), sb.from('task_reminders').select('*'), sb.from('app_settings').select('*').single(),
  ]);
  const newDB={
    people:(people.data||[]).map(p=>({id:p.id,name:p.name,phone:p.phone||'',color:p.color,boss:p.is_admin,tutorialSeen:p.tutorial_seen,authUserId:p.auth_user_id,password:''})),
    templates:{}, jobs:[], tasks:[], edges:[],
    fieldDefs:(fieldDefs.data||[]).map(d=>({id:d.id,label:d.label,fieldKey:d.field_key,type:d.type,sortOrder:d.sort_order,required:d.required})),
    fieldOptions:{},
    seq:1, threshold:(settings.data&&settings.data.wa_threshold)||5,
    notifyDays:(settings.data&&settings.data.notify_days)||[1,2,3,4,5],
  };
  (fieldOptions.data||[]).forEach(o=>{ (newDB.fieldOptions[o.field_key]=newDB.fieldOptions[o.field_key]||[]).push(o.value); });
  (chains.data||[]).forEach(c=>{ newDB.templates[c.id]={label:c.label,blurb:c.blurb||'',
    tasks:(chainTasks.data||[]).filter(t=>t.chain_id===c.id).map(t=>({id:t.id,name:t.name,owner:t.owner_name,days:t.days})),
    edges:(chainEdges.data||[]).filter(e=>e.chain_id===c.id).map(e=>({from:e.from_task,to:e.to_task,type:e.edge_type})) }; });
  (jobsRes.data||[]).forEach(o=>{ newDB.jobs.push({id:o.id,code:o.code,client:o.client,
    category:o.chain_id,start:o.start_date,ship:o.ship_date,customFields:o.custom_fields||{},
    links:(jobLinks.data||[]).filter(l=>l.job_id===o.id).map(l=>({id:l.id,url:l.url,label:l.label||'',addedBy:l.added_by,ts:l.created_at})),
    comments:(jobComments.data||[]).filter(c=>c.job_id===o.id).map(c=>({id:c.id,text:c.text,author:c.author,ts:c.created_at,editedAt:c.edited_at,acked:!!c.acked}))}); });
  (tasks.data||[]).forEach(t=>{ newDB.tasks.push({id:t.id,jid:t.job_id,name:t.name,owner:t.owner_name,days:t.days,status:t.status,
    actualStart:t.actual_start,actualEnd:t.actual_end,plannedStart:t.planned_start,
    comments:(comments.data||[]).filter(c=>c.task_id===t.id).map(c=>({id:c.id,text:c.text,author:c.author,ts:c.created_at,editedAt:c.edited_at,acked:!!c.acked})),
    reminders:(reminders.data||[]).filter(r=>r.task_id===t.id).map(r=>({id:r.id,text:r.text,dueDate:r.due_date,createdBy:r.created_by,createdAt:r.created_at,
      status:r.status,resolvedAt:r.resolved_at,resolvedBy:r.resolved_by,resolvedVia:r.resolved_via,replyCommentId:r.reply_comment_id})) }); });
  (taskEdges.data||[]).forEach(e=>{ newDB.edges.push({id:e.id,jid:e.job_id,from:e.from_task,to:e.to_task,type:e.edge_type}); });
  DB=newDB; PEOPLE=DB.people;
  applyBranding(settings.data);
}

// ---- auth: each person creates their own account on first use (self-service), tied to a
// hidden internal address never shown anywhere — avoids needing admin-creates-others'-accounts code ----
async function sbSignUp(personId,password){
  const {data,error}=await sb.auth.signUp({email:syntheticEmail(personId),password});
  if(error)return {error};
  await sb.from('people').update({auth_user_id:data.user.id}).eq('id',personId);
  return {data};
}
async function sbSignIn(personId,password){
  return await sb.auth.signInWithPassword({email:syntheticEmail(personId),password});
}
async function sbSignOut(){ try{await sb.auth.signOut();}catch(e){} }

let REALTIME_CHANNEL=null, REALTIME_DEBOUNCE=null;
function setupRealtime(){
  if(REALTIME_CHANNEL)return;
  const tables=['people','process_chains','chain_tasks','chain_edges','job_field_defs','field_options','jobs','job_links','job_comments','tasks','task_edges','task_comments','task_reminders','app_settings'];
  let ch=sb.channel('db-changes');
  tables.forEach(t=>{ ch=ch.on('postgres_changes',{event:'*',schema:'public',table:t},onRealtimeChange); });
  ch.subscribe();
  REALTIME_CHANNEL=ch;
}
function onRealtimeChange(){
  clearTimeout(REALTIME_DEBOUNCE);
  REALTIME_DEBOUNCE=setTimeout(async ()=>{
    if(!ME)return;
    const myName=ME.name;
    await loadFromSupabase();
    ME=PEOPLE.find(p=>p.name===myName)||ME;
    rerender();
  },400);
}

async function bootFromSupabase(){
  const [{data:peopleRows,error:peopleErr},{data:settingsRow}]=await Promise.all([
    sb.from('people').select('*'), sb.from('app_settings').select('*').single(),
  ]);
  applyBranding(settingsRow);
  if(peopleErr){
    document.getElementById('loginStep1').innerHTML='<p class="lf-err">Could not reach the server — check your connection and reload.</p>';
    console.error('boot: people fetch failed',peopleErr);
    return;
  }
  PEOPLE=(peopleRows||[]).map(p=>({id:p.id,name:p.name,phone:p.phone||'',color:p.color,boss:p.is_admin,tutorialSeen:p.tutorial_seen,authUserId:p.auth_user_id}));
  DB={people:PEOPLE,templates:{},jobs:[],tasks:[],edges:[],fieldDefs:[],fieldOptions:{},seq:1,threshold:5,notifyDays:[1,2,3,4,5]};
  renderLoginOptions();

  const {data:{session}}=await sb.auth.getSession();
  if(session){
    await loadFromSupabase();
    const myPerson=PEOPLE.find(p=>p.authUserId===session.user.id);
    if(myPerson){ setupRealtime(); login(myPerson.name); }
  }
}
bootFromSupabase();
// Safety net: if a valid session resolves shortly after the initial boot check
// (e.g. a token refresh still in flight), this catches it rather than leaving
// the person stuck on the login screen despite already being signed in.
sb.auth.onAuthStateChange(async (event,session)=>{
  if(event==='SIGNED_IN' && session && !ME){
    await loadFromSupabase();
    const myPerson=PEOPLE.find(p=>p.authUserId===session.user.id);
    if(myPerson){ setupRealtime(); login(myPerson.name); }
  }
});

</script>
